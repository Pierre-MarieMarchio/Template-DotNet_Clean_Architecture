name: Feature request
description: Something this project should do or have.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution: a proposal is judged by the need it settles. Report a vulnerability privately, never here: follow the reporting steps in SECURITY.md.
  - type: textarea
    id: need
    attributes:
      label: The problem
      description: What you cannot do today, and how you work around it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What this project would hold or do, and which part it changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: The other ways to settle the problem, and why this one is better.
    validations:
      required: false
