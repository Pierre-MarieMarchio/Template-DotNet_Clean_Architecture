name: Bug report
description: The project does something it should not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A report that can be reproduced is fixed first. Give the fewest steps that still show the problem, and paste output as text. Report a vulnerability privately, never here: follow the reporting steps in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the commit, you ran.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      options:
        - the domain, the use cases or the infrastructure
        #if (api)
        - the HTTP API
        #endif
        #if (anyWeb)
        - the web workspace
        #endif
        #if (jobsWorker)
        - the worker
        #endif
        #if (anyPresentation)
        - another host: the portal, the MCP server or the desktop app
        #endif
        - the build, the tests or the tools
        - the documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal steps to reproduce
      description: What you ran, in order and no more than needed, starting from a clean clone.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you observed
      description: The behaviour, error or file that is wrong.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The output of the failing step, pasted as text and cut to the lines that matter.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: dotnet --info
      #if (anyWeb)
      description: Its whole output; with the web workspace, also node --version and pnpm --version.
      #endif
      #if (!anyWeb)
      description: Its whole output.
      #endif
      render: text
    validations:
      required: true
