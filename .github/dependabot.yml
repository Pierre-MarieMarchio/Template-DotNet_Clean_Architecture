version: 2

updates:
  # NuGet: every version lives in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"

    groups:
      # The 10.0.x runtime band, one pull request per servicing release.
      microsoft-runtime:
        applies-to: version-updates
        patterns:
          - Microsoft.*
        exclude-patterns:
          - Microsoft.IdentityModel.*
          - Microsoft.Testing.*

      identity-model:
        applies-to: version-updates
        patterns:
          - Microsoft.IdentityModel.*

      test-tooling:
        applies-to: version-updates
        patterns:
          - Microsoft.Testing.*
          - xunit*
          - NSubstitute
          - Shouldly
          - NetArchTest.*
          - Testcontainers.*

      third-party-runtime:
        applies-to: version-updates
        patterns:
          - Asp.Versioning.*
          - FluentValidation*
          - MailKit
          #if (postgreSql)
          - Npgsql.*
          #endif
          - Scalar.*

      #if (postgreSql)
      # The OpenTelemetry 1.x band; Npgsql.OpenTelemetry stays with Npgsql.*.
      #else
      # The OpenTelemetry 1.x band.
      #endif
      observability:
        applies-to: version-updates
        patterns:
          - OpenTelemetry.*

  # GitHub Actions, pinned by SHA with the tag in a trailing comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  # Dockerfile base images; docker-compose.yml is its own ecosystem, below.
  - package-ecosystem: docker
    directories:
      - /Src/Presentation/AppTemplate.Api
      #if (anyWeb)
      # Every web app's nginx image, by directory glob.
      - /Src/Web/apps/*
      #endif
      #if (sonar)
      # The analysis image, Tools/sonar-scanner.Dockerfile, on the same SDK as the API's.
      - /Tools
      #endif
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    groups:
      container-images:
        applies-to: version-updates
        patterns:
          - "*"

  #if (anyWeb)
  # The web workspace: the npm ecosystem reads Src/Web/pnpm-lock.yaml for every app and package.
  - package-ecosystem: npm
    directory: /Src/Web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    groups:
      web-lint:
        applies-to: version-updates
        patterns:
          - eslint
          - "@eslint/*"
          - typescript-eslint
          - globals
      web-api-client:
        applies-to: version-updates
        patterns:
          - openapi-fetch
          - openapi-typescript
      web-tooling:
        applies-to: version-updates
        patterns:
          - typescript
          - vitest

  #endif
  # docker-compose.yml's images, version updates only.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    groups:
      compose-images:
        applies-to: version-updates
        patterns:
          - "*"
