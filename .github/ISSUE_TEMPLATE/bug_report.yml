name: Bug report
description: A generated project, or the template itself, does something it should not.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A report that can be reproduced is fixed first. Give the shortest generation command and the fewest steps that still show the problem, and paste output as text. Report a vulnerability privately, never here: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Template version
      description: The version the generated project's docs/getting-started/overview.md records, or `dotnet new list cleanarch` shows; a commit when installed from a checkout.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - nuget.org
        - a .nupkg packed locally
        - a checkout of this repository
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Generation command
      description: The whole `dotnet new` command, every option included, and any cleanarch-webapp, cleanarch-webpackage or cleanarch-presentation run after it.
      render: shell
      placeholder: dotnet new cleanarch-webapi -n Acme.Shop --auth none --examples none --files false
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal steps to reproduce
      description: What you ran after generation, in order and no more than needed, for example bootstrap, build, test or docker compose up.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you observed
      description: The behaviour, error or file that is wrong.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The output of the failing step, pasted as text and cut to the lines that matter.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: dotnet --info
      description: Its whole output; with a web app, also node --version and pnpm --version.
      render: text
    validations:
      required: true
  - type: dropdown
    id: leg
    attributes:
      label: Closest acceptance leg
      description: The shape of docs/template/maintaining-the-template.md's acceptance matrix nearest to your options, if one is.
      options:
        - none of them
        - defaults
        - several hosts, local auth, notes
        - local auth, no files, no ci, no sonar
        - worker, mcp and blazor wasm, external auth, all examples
        - sql server, avalonia, external auth, all examples
        - no api, blazor server, mcp and worker, external auth, no agent files
        - external auth, no examples, no files
        - sqlite, external auth, all examples
        - sqlite, defaults
        - web placeholder, sqlite, smallest project
        - web react back office, local auth
        - web angular, external auth, notes
        - no web, then a react app, its workspace and an angular back office
        - web, every starter
        - windows, wpf, local auth
        - windows, wpf, external auth, notes
    validations:
      required: false
