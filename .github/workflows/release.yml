name: Release

# Tag-driven. `v1.2.3` publishes 1.2.3, 1.2, 1 and latest; `v1.2.3-rc.1` publishes only the
# full prerelease tag and never moves `latest`.
#
# No secret to create: GITHUB_TOKEN authenticates against GHCR for the repository that owns the
# workflow. If you push somewhere else, add a registry credential and change the `login` step —
# do not widen `permissions` to compensate.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.2.3"
        required: true
        type: string

# Nothing here may write to the repository contents. Each job asks for exactly what it needs and
# no job inherits another's grant.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CONFIGURATION: Release
  SOLUTION: AppTemplate.sln
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # A tag is not a licence to skip the gate. Everything below depends on this.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Verify formatting
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Build
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore

      # No coverage at release time: the floor is a gate on a change, and this
      # workflow runs on a tag that already passed it.
      - name: Test
        run: |
          #if (templateMaintenance)
          # The test-count floor is this repository's own, a round number below the real total
          # of its suite matching ci.yml: a release built from a solution that ran no tests is
          # the one release nobody would question, and a project generated with fewer options
          # starts below any number this suite could justify, so its release carries no floor.
          minimum_tests=3000
          floor_option="--minimum-expected-tests ${minimum_tests}"
          #endif
          dotnet test "$SOLUTION" \
            --configuration "$CONFIGURATION" \
            --no-build \
            ${floor_option}

      - name: Audit dependencies
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error title=Vulnerable packages::Refusing to release with a known advisory."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The migration bundle. This is what a deployment runs against the database;
  # the API applies migrations at startup in Development only.
  #
  # Built here rather than in a deploy job so that the artifact is produced from
  # the same commit as the image, and so applying migrations never needs the SDK
  # or the source tree on the target.
  migration-bundle:
    name: Migration bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool restore

      # --self-contained so the target needs no .NET runtime at all: the bundle is
      # the single thing you copy to run pending migrations.
      #
      # The bundle embeds no connection string. Supply one at run time:
      #   ./efbundle --connection "$CONNECTION_STRING"
      # Use a migration-time principal with DDL rights, NOT the application's
      # runtime user — the app should not be able to alter its own schema.
      #if (localAuth)
      # One bundle per context, and both, because one bundle covers one context. A release
      # carrying only the business bundle leaves the `identity` schema absent, and an API whose
      # identity tables do not exist starts and then fails the first sign-in. The two are
      # independent -- no foreign key crosses the schemas -- so the order below is for consistency
      # with the Development bootstrap rather than a correctness requirement.
      - name: Build the identity bundle
        run: |
          dotnet ef migrations bundle \
            --project Src/Infrastructure/AppTemplate.Infrastructure.Auth \
            --startup-project Src/Infrastructure/AppTemplate.Infrastructure.Auth \
            --configuration "$CONFIGURATION" \
            --self-contained \
            --target-runtime linux-x64 \
            --force \
            --output efbundle-identity

      #endif
      - name: Build the business bundle
        run: |
          dotnet ef migrations bundle \
            --project Src/Infrastructure/AppTemplate.Infrastructure.Persistence \
            --startup-project Src/Infrastructure/AppTemplate.Infrastructure.Persistence \
            --configuration "$CONFIGURATION" \
            --self-contained \
            --target-runtime linux-x64 \
            --force \
            --output efbundle

      # Both, named: a job that asserted one of them would go green on the release that shipped
      # half a schema, which is the failure this step exists to catch.
      - name: Assert both bundles exist and are executable
        run: |
          #if (localAuth)
          for bundle in efbundle-identity efbundle; do
          #else
          for bundle in efbundle; do
          #endif
            test -x "$bundle" || {
              echo "::error title=No bundle::$bundle was not produced."
              exit 1
            }
          done
          #if (localAuth)
          ls -l efbundle-identity efbundle
          #else
          ls -l efbundle
          #endif

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-bundle-${{ inputs.tag || github.ref_name }}
          path: |
            #if (localAuth)
            efbundle-identity
            #endif
            efbundle
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  image:
    name: Container image (${{ matrix.component }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One image: the API, which serves HTTP and runs the periodic jobs. A separate runner process,
    # if one is ever extracted, earns its own entry here rather than a second copy of the API's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: Src/Presentation/AppTemplate.Api/Dockerfile
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing material for the attestation
      attestations: write    # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The emulators are installed from an image, and the action's default is the floating
      # `tonistiigi/binfmt:latest` — run privileged, on the runner that holds the push credentials.
      # Pinned by digest; Dependabot does not read a `with:` input, so bump it by hand.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      # The BuildKit daemon this builder runs is an image too, and the action's default is the
      # floating `moby/buildkit:buildx-stable-1`. Pinned by digest like every image in this
      # repository; Dependabot does not read a `with:` input, so bump it by hand alongside the action.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name must be lowercase; a repository with capitals in its name
      # would otherwise fail at push with an unhelpful error.
      - name: Compute image name
        id: name
        run: echo "image=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      # `latest` is attached only for a stable semver tag: the enable expression
      # excludes anything with a prerelease suffix, so an rc never becomes latest.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM and a provenance record travel with the image rather than in a
          # separate artifact nobody correlates afterwards.
          # The SBOM is produced by a scanner image BuildKit runs over the build; `true` would
          # select the floating `docker/buildkit-syft-scanner:stable-1`. Named and pinned instead,
          # by hand like the two images above.
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed provenance linking the digest to this workflow run and commit.
      # `docker/build-push-action` records provenance inside the image; this makes it
      # independently verifiable with `gh attestation verify`.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Verify:"
            echo '```'
            echo "gh attestation verify oci://${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
