# Non-secret configuration for AppTemplate.Worker. Shorter than configmap-api.yaml because this
# host has no HTTP surface: no AllowedHosts, no Cors, no ReverseProxy, no Shutdown (that section
# is bound only by AppTemplate.Api's own Common/Lifecycle module — see
# Src/Presentation/AppTemplate.Worker/Program.cs, which registers no such option and therefore
# runs on the .NET Generic Host's own default shutdown timeout, not the 30 s this template tunes
# for the API). It still composes AppTemplate.Infrastructure.Identity — for
# IRefreshTokenMaintenance's adapter, and above all for IUserProfilesService, which
# EmailReminderNotifier needs to find the address a due reminder is rung at — and therefore still
# validates Jwt, EmailConfirmation, PasswordReset and EmailChange at startup, exactly as if it
# served requests. It also composes
# AppTemplate.Infrastructure.Email — for IReminderNotifier's mail adapter, a due reminder is rung
# by mail — and therefore validates Email (SMTP) at startup too. See docs/CONFIGURATION.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-template-worker-config
  labels:
    app.kubernetes.io/name: app-template-worker
    app.kubernetes.io/part-of: app-template
    app.kubernetes.io/component: worker
data:
  DOTNET_ENVIRONMENT: "Production"

  # Validated at startup by the Identity module this host composes, even though it never issues
  # or checks a token over HTTP. Keep identical to configmap-api.yaml's values: the two hosts
  # reason about the same tokens — a refresh token minted by the API is the one this worker's
  # IRefreshTokenMaintenance purges — so a mismatch here would not fail loudly, it would just
  # make the two hosts disagree about what a valid token looks like.
  Jwt__Issuer: "https://api.example.com"
  Jwt__Audience: "app-template-clients"

  # NOT the API's signing key, and not a secret at all — which is why it sits in a ConfigMap next
  # to the two values above rather than in app-template-secrets. JwtOptionsValidator requires a
  # non-blank value of at least 32 bytes and nothing in this host ever uses it: AccessTokenIssuer
  # is the only thing that signs with it, no loop here resolves it, and bearer validation needs an
  # inbound request this process does not have. Handing this pod the real key would give anything
  # that got into a container whose job is deleting expired rows the power to mint an access token
  # for any user — see SECURITY.md.
  #
  # If a future loop in this host ever does need to mint or check a token, it will fail with an
  # invalid signature rather than silently work, and this value says so out loud when it appears
  # in a stack trace.
  Jwt__Key: "this-host-neither-signs-nor-verifies-a-token"

  # Same three required URLs as configmap-api.yaml, same reasoning: this host does not send any of
  # this mail, but AppTemplate.Infrastructure.Identity validates all three sections regardless of
  # which host composes it.
  EmailConfirmation__ConfirmEmailUrl: "https://app.example.com/confirm-email"
  PasswordReset__ResetPasswordUrl: "https://app.example.com/reset-password"
  EmailChange__ConfirmEmailChangeUrl: "https://app.example.com/confirm-email-change"

  # --- Email (SMTP) — required, no default. Unlike EmailConfirmation/PasswordReset/EmailChange -
  # above, this section is NOT a coupling cost of AppTemplate.Infrastructure.Identity: this host
  # composes AppTemplate.Infrastructure.Email in its own right, for IReminderNotifier's adapter (a
  # reminder that comes due is rung by mail — see Program.cs and AppTemplate.Worker.csproj). Kept
  # identical to configmap-api.yaml's values, same reasoning as the three URLs above.
  Email__Host: "smtp.example.com"
  Email__Port: "587"
  Email__Security: "StartTls"
  Email__FromAddress: "no-reply@example.com"
  Email__FromName: "AppTemplate"

  # This replica's own pool against the SAME PostgreSQL server the API's replicas draw from — see
  # docs/DEPLOYMENT.md and docs/CONFIGURATION.md ("the worker is a replica of the same budget, not
  # a bystander"). Raising worker-deployment.yaml's replica count multiplies this number exactly
  # as it does for the API.
  Database__MaxPoolSize: "20"

  # AppTemplate.Worker only. Restated at its shipped default so the interval is visible next to
  # the deployment that runs it, not just in docs/CONFIGURATION.md.
  MaintenanceWorker__Interval: "01:00:00"
  MaintenanceWorker__PurgeExpiredIdempotencyKeysEnabled: "true"
  MaintenanceWorker__PurgeExpiredRefreshTokensEnabled: "true"

  # The Files feature's three passes: two sweeps and the inspection. ReclaimOrphanedContent is not
  # housekeeping: with no soft delete, it is the only thing that ever removes the bytes of a deleted
  # file, so disabling it leaks storage quietly.
  # None of the three takes the leader lease, and none needs it for correctness — all are
  # idempotent, and the reclamation's safety comes from listing the store before reading the rows,
  # not from being alone. At replicas: 2 the reclamation does cost a second full walk of the store
  # every cycle; that is a price, not a bug, and the day it stops being worth paying the lease
  # belongs in the use case rather than in the loop. See CONTRIBUTING.md.
  FileWorker__PurgeAbandonedRegistrationsInterval: "01:00:00"
  FileWorker__PurgeAbandonedRegistrationsEnabled: "true"
  FileWorker__ReclaimOrphanedContentInterval: "12:00:00"
  FileWorker__ReclaimOrphanedContentEnabled: "true"

  # The third pass, and the only one a user feels: nothing else moves a file from deposited to
  # available, so this interval is an upload's time-to-readable and Enabled: "false" stops the
  # Files feature rather than degrading it. Restated here because it was the one FileWorker key no
  # manifest mentioned, which read as a feature this deployment had switched off.
  FileWorker__InspectDepositedFilesInterval: "00:01:00"
  FileWorker__InspectDepositedFilesEnabled: "true"

  # AppTemplate.Worker's third BackgroundService — the other two being maintenance and files —
  # restated at its shipped default for the same reason. Enabled
  # is the off switch an operator reaches for during a maintenance window, or while a deployment is
  # still validating the IReminderNotifier it wired in: the reminder loop stops, everything else in
  # this host keeps running.
  ReminderWorker__Interval: "00:01:00"
  ReminderWorker__Enabled: "true"

  # --- Storage: the object store the Files feature keeps file content in. REQUIRED, and the -------
  # reason this block exists at all: BucketName is blank in the tracked appsettings.json and
  # StorageOptionsValidator refuses a blank one, so a deployment without it does not start. Both
  # hosts compose AddStorageModule (see each Program.cs), so both ConfigMaps carry this block —
  # the worker reaches the store to reclaim orphaned objects and to read the bytes it inspects.
  #
  # Endpoint is the one key that is legitimately blank: absent means Amazon S3 itself. Set it only
  # for an S3-compatible store (MinIO, Ceph, R2), and then set ForcePathStyle too — virtual-host
  # addressing would resolve <bucket>.<host>, which such a store rarely serves.
  Storage__BucketName: "app-template-files"
  Storage__Region: "eu-west-3"
  Storage__Endpoint: ""
  Storage__ForcePathStyle: "false"

  # The name a CLIENT resolves, which is not always the one this pod uses. A presigned URL covers
  # the host it was signed for, so a deployment reaching the store under an in-cluster Service name
  # while browsers reach it under a public one MUST set this to the public one or every grant it
  # mints answers 403 SignatureDoesNotMatch. Blank means "sign for Endpoint", which is correct
  # whenever the two names are the same — as they are against Amazon S3.
  Storage__PublicEndpoint: ""

  # --- ContentInspection: blank ScannerHost is a DECISION, and it is the shipped one. -------------
  # With no host, the file's leading bytes are still read and the media-type check still runs — a
  # PNG whose bytes are an SVG is refused in every deployment — but nothing looks for malware, and
  # SECURITY.md is where that is written down for whoever inherits this cluster. Point it at a
  # clamd Service to close that gap.
  #
  # Do NOT set a host you are not sure is reachable: an unreachable scanner is reported as "no
  # verdict", which is deliberately not a pass, so every upload stays unreadable until it answers.
  # That is the correct behaviour and it is also an outage.
  ContentInspection__ScannerHost: ""
  ContentInspection__ScannerPort: "3310"
  ContentInspection__MaxScannableBytes: "26214400"
