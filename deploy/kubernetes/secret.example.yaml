# The SHAPE of the secrets both hosts need, not a source of truth. Every value below is a
# placeholder — SECURITY.md's rule for the tracked appsettings.json ("every secret-shaped value
# is an empty string") applies here too, for the same reason: a secret checked into a repository,
# even a repository nobody reads, is not a secret anymore.
#
# Do not `kubectl apply -f secret.example.yaml` as-is. Either edit a local, untracked copy before
# applying, or — better, for anything beyond a throwaway cluster — generate this object from a
# real secret manager instead of writing it by hand: `kubectl create secret generic --from-env-file`
# against a file that never enters version control, or a controller that syncs from Vault / AWS
# Secrets Manager / GCP Secret Manager (External Secrets Operator, Sealed Secrets, or your
# platform's equivalent) so the plaintext never exists as a file at all.
#
# One Secret, not one per host, because ConnectionStrings__Default and the SMTP credentials below
# are the same values for both AppTemplate.Api and AppTemplate.Worker (see docs/DEPLOYMENT.md).
# Jwt__Key is the exception and the reason to read the next paragraph: only api-deployment.yaml
# references it. The worker gets a meaningless placeholder from configmap-worker.yaml instead,
# because it signs and verifies nothing — see SECURITY.md.
# AppTemplate.Worker composes AppTemplate.Infrastructure.Email too — for
# IReminderNotifier's mail adapter, see AppTemplate.Worker.csproj — so its Deployment references
# Email__UserName / Email__Password exactly like the API's does. Both Deployments below reference
# individual keys with secretKeyRef rather than envFrom, the same choice docker-compose.yml makes
# and for the same reason: a container gets exactly the secret keys it needs, not every key in the
# object — that discipline is about which keys reach which container, not about which host
# composes which module.
apiVersion: v1
kind: Secret
metadata:
  name: app-template-secrets
  labels:
    app.kubernetes.io/part-of: app-template
type: Opaque
stringData:
  # Npgsql connection string. Points at the RUNTIME database user — DML only, no DDL (SECURITY.md
  # #7). The user with DDL rights belongs to migration-job.yaml's own secret, never this one.
  ConnectionStrings__Default: "CHANGE_ME-Host=postgres;Port=5432;Database=appdb;Username=app_runtime;Password=CHANGE_ME"

  # HS256 signing key, minimum 32 bytes, real entropy: openssl rand -base64 48. Referenced by
  # api-deployment.yaml alone — anything holding this value can mint an access token for any user,
  # so it reaches the one host that has a reason to hold it and no other.
  Jwt__Key: "CHANGE_ME-generate-with-openssl-rand-base64-48-minimum-32-bytes"

  # SMTP credentials. Optional per docs/CONFIGURATION.md (some relays authenticate by source IP
  # instead) — leave both blank if that is your relay, do not invent placeholder credentials.
  Email__UserName: ""
  Email__Password: ""
---
# A SEPARATE Secret, deliberately not folded into the one above. SECURITY.md #6 is explicit: the
# runtime user in app-template-secrets gets DML only, and the migration-time principal gets DDL
# and nothing else — one Secret holding both would make it one credential away from every pod
# being able to alter its own schema, which is exactly the blast radius keeping migrations out of
# application startup removes — see CONTRIBUTING.md's Migrations section.
# Referenced only by migration-job.yaml; neither Deployment in this directory reads it.
apiVersion: v1
kind: Secret
metadata:
  name: app-template-migration-db-credentials
  labels:
    app.kubernetes.io/part-of: app-template
    app.kubernetes.io/component: migration
type: Opaque
stringData:
  # Same database, different principal — one with DDL rights, granted for the duration of the
  # deployment and nothing more. Not the same value as ConnectionStrings__Default above.
  ConnectionString: "CHANGE_ME-Host=postgres;Port=5432;Database=appdb;Username=app_migrator;Password=CHANGE_ME"
