name: SonarQube

# Static analysis, apart from ci.yml so that a project without Sonar stays green; the build runs under the scanner.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Same policy as ci.yml.
concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release
  SOLUTION: AppTemplate.sln

jobs:
  analysis:
    name: Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Skipped while the SONAR_ORGANIZATION and SONAR_PROJECT_KEY repository variables are unset, and for a fork's pull request, which gets no secret.
    if: >-
      vars.SONAR_ORGANIZATION != ''
      && vars.SONAR_PROJECT_KEY != ''
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)

    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Full history: Sonar's blame and new-code baseline need it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The scanner shells out to a JRE; 21 is the oldest Java the service supports.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Keyed by the Java version, since another runtime cannot read the cache.
      - name: Cache SonarQube analysis
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-java21-${{ hashFiles('**/*.csproj') }}
          restore-keys: sonar-${{ runner.os }}-java21-

      # The scanner version is pinned in .config/dotnet-tools.json.
      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore "$SOLUTION"

      #if (templateMaintenance)
      # Template repository only: it ships no migration, so each context's first one is created here, as bootstrap creates a project's.
      - name: Create the initial migrations
        run: |
          dotnet tool restore
          dotnet run Tools/Tasks.cs migration-initial

      #endif
      # The mail templates are excluded from duplication only; the report pattern matches the extension, as Tools/CoverageGate.cs does.
      - name: Begin analysis
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.cs.cobertura.reportsPaths="TestResults/**/*.cobertura.xml" \
            /d:sonar.cpd.exclusions="**/*.html" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.qualitygate.wait=true

      # This build is the analysis; begin relaxes warnings-as-errors for Sonar's own rules only.
      - name: Build under the scanner
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore

      # Measured again, with the switches and settings Tools/Tasks.cs uses.
      - name: Test with coverage
        run: |
          dotnet test \
            --solution "$SOLUTION" \
            --configuration "$CONFIGURATION" \
            --no-build \
            --results-directory TestResults \
            --coverage \
            --coverage-settings coverage.runsettings \
            --coverage-output-format cobertura

      # Waits on the quality gate, which judges new code only, and fails the job when it is red.
      - name: End analysis
        if: always()
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
