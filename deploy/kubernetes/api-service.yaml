# ClusterIP only. Nothing reaches the API pods directly — ingress.yaml is the one entry point,
# and it is also the one place TLS terminates (docs/adr/0012).
apiVersion: v1
kind: Service
metadata:
  name: app-template-api
  labels:
    app.kubernetes.io/name: app-template-api
    app.kubernetes.io/part-of: app-template
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app-template-api
  ports:
    - name: http
      port: 80
      targetPort: http
