name: Template published package

# Template repository only: once a week, builds what nuget.org serves today, because a security advisory published since the last release makes NuGetAudit fail every new project's build, and nothing else builds the published package between releases.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-published-package
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  PACKAGE_ID: CleanArch.WebApi.Templates

jobs:
  published:
    name: Build the published package's default project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The generated project's global.json allows any later .NET 10 SDK, so the runner's newest one is what a user's machine runs.
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # No version on nuget.org fails the run: there is nothing for a user to install either, and a green week would prove nothing.
      - name: Find the latest published version
        id: version
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --location --output "${{ runner.temp }}/versions.json" --write-out '%{http_code}' "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID,,}/index.json")
          if [ "$status" != "200" ]; then
            echo "::error title=No published version::nuget.org holds no $PACKAGE_ID (HTTP $status): nothing published reaches users, so there is nothing to build."
            exit 1
          fi
          version=$(jq -r '[.versions[] | select(contains("-") | not)] | last // empty' "${{ runner.temp }}/versions.json")
          if [ -z "$version" ]; then
            echo "::error title=No stable version::nuget.org lists $PACKAGE_ID with no stable version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Latest published version: $version"

      # A scratch hive keeps the runner's own templates out of the way, as a user's first install has none.
      - name: Install the published package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet new install "$PACKAGE_ID::$VERSION" --nuget-source https://api.nuget.org/v3/index.json --debug:custom-hive "${{ runner.temp }}/hive"

      - name: Generate the default project
        run: dotnet new cleanarch-webapi -n Sample.Published.Project -o "${{ runner.temp }}/generated" --debug:custom-hive "${{ runner.temp }}/hive"

      # The restore takes the local tools the project pins from nuget.org, CleanArch.Cli at the template's version among them, so a tool not published beside the template fails here.
      - name: Bootstrap
        working-directory: ${{ runner.temp }}/generated
        run: |
          dotnet tool restore
          dotnet cleanarch bootstrap

      # The project's Directory.Build.props sets NuGetAudit to low over every dependency and TreatWarningsAsErrors, so an advisory on a pinned package fails this step as it fails a user's. It names no solution file, since the published version writes an .sln or an .slnx.
      - name: Build with warnings as errors
        working-directory: ${{ runner.temp }}/generated
        run: dotnet build --configuration Release

      # A red run is announced by GitHub alone, to whoever last changed the cron line: docs/template/maintaining-the-template.md says what to do.
      - name: Say what a red run means
        if: failure()
        run: echo "::error title=The published package does not build::Read the failed step above. An NU190x warning names an advisory on a pinned dependency; raise it in a release, as docs/guides/build-and-ci.md says."
