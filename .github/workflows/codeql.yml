name: CodeQL

# Code scanning beside the gate: its alerts land in the repository's Security tab, and the weekly run picks up new queries.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# One run per ref: a new push cancels the previous one, except on main and develop.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  SOLUTION: AppTemplate.sln

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # security-events uploads the results; actions reads the run's own metadata in a private repository.
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          #if (anyWeb)
          - language: javascript-typescript
            build-mode: none
          #endif
          #if (templateMaintenance)
          - language: actions
            build-mode: none
          #endif

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The extractor reads what the compiler compiles: the solution, then each file-based tool, which no project holds.
      - name: Build
        if: matrix.language == 'csharp'
        run: |
          set -euo pipefail
          dotnet build "$SOLUTION" --configuration Release
          for tool in Tools/*.cs; do
            dotnet build "$tool" --configuration Release
          done

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
