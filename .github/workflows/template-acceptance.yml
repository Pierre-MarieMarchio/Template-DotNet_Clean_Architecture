name: Template acceptance

# Template repository only: each leg installs the template package packed from this checkout, generates under another name and gates what an adopter would get.
on:
  push:
    branches: [main]
  # develop, the default branch, is proved whole once a night when it has moved; its pull requests ran the legs their change reaches.
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# One run per ref: a new push to a pull request cancels the previous one. A label other than full-acceptance runs apart, in a group of its own, so it cancels nothing.
concurrency:
  group: template-acceptance-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-acceptance' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege; nothing here writes to the repository.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # Packed once; every leg installs this .nupkg, so what is proved is what a user installs.
  pack:
    name: Pack the template package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack .template.config/TemplatePackage.csproj --configuration Release --output "${{ runner.temp }}/package"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-package
          path: ${{ runner.temp }}/package/*.nupkg
          if-no-files-found: error
          retention-days: 3

      # The generated tool manifest pins dotnet cleanarch at the template's version, which nuget.org holds only once released.
      - name: Pack the project's tool
        run: dotnet pack launcher/CleanArch.Cli/CleanArch.Cli.csproj --configuration Release --output "${{ runner.temp }}/tools"

      - name: Upload the project's tool
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-tool
          path: ${{ runner.temp }}/tools/*.nupkg
          if-no-files-found: error
          retention-days: 3

  # The legs a pull request's change can affect, from .template.config/acceptance; any other event runs them all, a night's run only when develop has moved, and a label other than full-acceptance none.
  changes:
    name: Select the acceptance legs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.select.outputs.run }}
      run_count: ${{ steps.select.outputs.run_count }}
      run_windows: ${{ steps.select.outputs.run_windows }}
      run_windows_count: ${{ steps.select.outputs.run_windows_count }}
      skip: ${{ steps.select.outputs.skip }}
      skip_count: ${{ steps.select.outputs.skip_count }}

    steps:
      # A pull request checks out its merge commit; its first parent is the base branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: The selector can fail
        run: dotnet run .template.config/acceptance/SelectLegs.cs -- --self-test

      # The last scheduled run that proved a tree, passed or failed, not one cancelled; a list that cannot be read counts as a move, so the legs run.
      - name: Has develop moved since the last scheduled run
        id: moved
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow template-acceptance.yml --event schedule --branch develop --status completed --limit 30 \
            --json headSha,conclusion --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // ""') || last=""
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      # --no-renames lists a moved file's old path as well as its new one; a diff that fails leaves no file, which runs every leg.
      - name: Select the legs the change can affect
        id: select
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          MOVED: ${{ steps.moved.outputs.moved }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          changed="${{ runner.temp }}/changed-paths.txt"
          if [ "$EVENT" = pull_request ] && ! git diff --name-only --no-renames HEAD^1 HEAD > "$changed"; then
            rm -f "$changed"
          fi
          dotnet run .template.config/acceptance/SelectLegs.cs -- --event "$EVENT" --action "$ACTION" --label "$LABEL" --moved "${MOVED:-true}" --labels "$LABELS" --changed "$changed" --output "$GITHUB_OUTPUT"

  # The legs are the shapes the options produce, not their cross product, listed in .template.config/acceptance/matrix.json; auth_context says whether the Auth DbContext exists.
  template:
    name: Template acceptance (${{ matrix.name }})
    needs: [changes, pack]
    if: needs.changes.outputs.run_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes || 45 }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.run) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the project's tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: project-tool
          path: ${{ runner.temp }}/tools

      - name: Download the template package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: template-package
          path: ${{ runner.temp }}/package

      - name: Install the template package
        run: dotnet new install "${{ runner.temp }}"/package/*.nupkg

      # A name unlike AppTemplate's in shape and length; the options stay unquoted, being several arguments from the matrix.
      - name: Generate a project under a different name
        env:
          OPTIONS: ${{ matrix.options }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dotnet new cleanarch-webapi -n Sample.Generated.Project -o "${{ runner.temp }}/generated" $OPTIONS
          if [ -n "$(find "${{ runner.temp }}/generated/docs" -name index.md)" ]; then
            echo "::error title=Index shipped::The generated project carries a docs index; bootstrap writes it."
            exit 1
          fi

      # The manifest pins dotnet cleanarch at the template's version, which nuget.org holds only once released: the packed one is restored.
      - name: Restore the project's tools, its own from the packed one
        working-directory: ${{ runner.temp }}/generated
        run: dotnet tool restore --add-source "${{ runner.temp }}/tools"

      # Before any item template or official CLI writes a file: bootstrap's formatting may reorder these, and must remove none.
      - name: Record the using directives the template wrote
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          find . \( -name .git -o -name bin -o -name obj -o -name node_modules \) -prune -o -name '*.cs' -print0 \
            | xargs -0 -r awk 'FNR == 1 { sub(/^\357\273\277/, "") } { sub(/\r$/, "") } /^(global )?using [A-Za-z_][^(;]*;$/ { print FILENAME ": " $0 }' \
            | LC_ALL=C sort > "${{ runner.temp }}/usings-generated.txt"
          echo "$(wc -l < "${{ runner.temp }}/usings-generated.txt") using directives recorded."

      # The project file records the name and the options generation was given, every other option under its default; the joins below record each part added after.
      - name: Assert cleanarch.json records the leg's options
        env:
          OPTIONS: ${{ matrix.options }}
        run: dotnet run .template.config/acceptance/CheckProjectFile.cs -- "${{ runner.temp }}/generated" Sample.Generated.Project "$OPTIONS"

      - name: Assert the template's own name leaked nowhere
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          content=$(grep -rIil --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj -e 'AppTemplate' -e 'app-template' . || true)
          paths=$(find . \( -name .git -o -name bin -o -name obj \) -prune -o \( -iname '*AppTemplate*' -o -iname '*app-template*' -o -name 'A[T].*' \) -print)
          if [ -n "$content$paths" ]; then
            echo "::error title=Template name leaked::The generated project still names the template."
            printf '%s\n' "$content" "$paths"
            exit 1
          fi

      # A project carries one database provider: no other provider's package, type or SQL reaches its code, tests or tooling.
      - name: Assert no other database provider leaked into the project
        working-directory: ${{ runner.temp }}/generated
        env:
          DATABASE: ${{ matrix.database || 'postgresql' }}
        run: |
          set -euo pipefail
          case "$DATABASE" in
            postgresql) forbidden='SqlServer|SqlClient|MsSql|MySql|Pomelo|VersionStamping|SchemaAsTablePrefix|database-(sqlserver|sqlite)' ;;
            sqlserver) forbidden='Npgsql|PostgreSql|xmin|pg_|MySql|Pomelo|SchemaAsTablePrefix' ;;
            sqlite) forbidden='Npgsql|PostgreSql|xmin|pg_|SqlServer|SqlClient|MsSql|MySql|Pomelo' ;;
            *) echo "::error title=Unknown database::$DATABASE"; exit 1 ;;
          esac
          leaked=$(grep -rIlE "$forbidden" --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj --exclude-dir=node_modules --exclude-dir=docs . || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Database provider leaked::A --database $DATABASE project names another provider."
            grep -rInE "$forbidden" $leaked | head -50
            exit 1
          fi

      # The API is ready for a web app in every project; the workspace, its workflow, its Dependabot entry and its Compose wiring come with the first app only.
      - name: Assert a project without a web app carries no web workspace
        if: matrix.web != 'true' || matrix.first_app
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          problems=()
          [ ! -e src/Web ] || problems+=("src/Web exists.")
          [ ! -e .github/workflows/web.yml ] || problems+=(".github/workflows/web.yml exists.")
          workflows=$(grep -rIl -e 'pnpm' -e 'src/Web' -e 'web-' .github/workflows || true)
          [ -z "$workflows" ] || problems+=("A workflow runs pnpm or a web job: $workflows")
          ! grep -qE '^include:|^  web-|src/Web' docker-compose.yml || problems+=("docker-compose.yml includes or declares a web service.")
          ! grep -qE 'package-ecosystem: npm|src/Web' .github/dependabot.yml || problems+=(".github/dependabot.yml watches the web workspace.")
          ! grep -qE '^WEB_[A-Z0-9_]+_HOST_PORT=' .env.example || problems+=(".env.example names a web app's port.")
          ignored=$(grep -l 'src/Web' .dockerignore .gitignore || true)
          [ -z "$ignored" ] || problems+=("An ignore file names src/Web: $ignored")
          if [ "${#problems[@]}" -gt 0 ]; then
            echo "::error title=Web trace::A project generated without --web holds or wires a web workspace."
            printf '%s\n' "${problems[@]}"
            exit 1
          fi

      # The generated project's packageManager and .node-version are this checkout's, word for word, so pnpm and Node.js are set up from the checkout before any part is added: an added framework app is created by its official CLI.
      - name: Set up pnpm (web legs)
        if: matrix.web == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/Web/package.json
          cache: true
          cache_dependency_path: src/Web/pnpm-lock.yaml

      - name: Set up Node.js (web legs)
        if: matrix.web == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/Web/.node-version

      # A project generated without a web app takes its first one, and the workspace around it, from the item template; dotnet cleanarch add completes it below.
      - name: Add the first app with cleanarch-webapp --workspace
        if: matrix.first_app
        working-directory: ${{ runner.temp }}/generated
        env:
          FIRST_APP: ${{ matrix.first_app }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dotnet new cleanarch-webapp -n Site $FIRST_APP
          leaked=$(grep -rIl -e AppTemplate -e app-template -e PlaceholderSite -e placeholder-site -e FrameworkSite -e framework-site src/Web .github docs || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Item template token leaked::$leaked"
            exit 1
          fi

      # A project generated without a presentation project takes one from the item template; dotnet cleanarch add completes it below.
      - name: Add the presentation project with cleanarch-presentation
        if: matrix.first_presentation
        working-directory: ${{ runner.temp }}/generated
        env:
          FIRST_PRESENTATION: ${{ matrix.first_presentation }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dotnet new cleanarch-presentation -n Portal --project-name Sample.Generated.Project $FIRST_PRESENTATION
          leaked=$(grep -rIl -e AppTemplate -e app-template -e PresentationApp -e presentation-app -e PRESENTATION_APP src/Presentation tests/Presentation docs || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Item template token leaked::$leaked"
            exit 1
          fi

      # A WebAssembly app brings the .NET client: its README lists the lines outside its folders, and dotnet cleanarch add completes it below, before the build, so every .NET step reads it.
      - name: Add a Blazor WebAssembly app with cleanarch-webapp
        if: matrix.wasm_app
        working-directory: ${{ runner.temp }}/generated
        env:
          WASM_APP: ${{ matrix.wasm_app }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dotnet new cleanarch-webapp -n WasmSite --framework blazor-wasm --port 8089 --project-name Sample.Generated.Project $WASM_APP
          leaked=$( (grep -rIl -e AppTemplate -e apptemplate src/Web/apps/WasmSite src/Presentation/SGP.Presentation.Client tests/Presentation/SGP.Presentation.Client.UnitTests docs; grep -rIl -e FrameworkSite -e framework-site -e FRAMEWORK_SITE src/Web/apps/WasmSite) || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Item template token leaked::$leaked"
            exit 1
          fi

      # ASP.NET Core tolerates the trailing comma a condition can leave; a strict parser does not. Before any official CLI runs, so what is read is what the templates wrote.
      - name: Assert every generated JSON file is strict JSON
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))' "$file" 2>"${{ runner.temp }}/json-error"; then
              echo "::error file=$file,title=Not strict JSON::$(cat "${{ runner.temp }}/json-error")"
              status=1
            fi
          done < <(find . \( -name .git -o -name bin -o -name obj -o -name node_modules \) -prune -o -name '*.json' -print0)
          exit "$status"

      # What a user runs after dotnet new: the join makes the lines the part's README lists outside its folders, so one missing fails a later step, then the part is created; a second add of a complete part refuses and writes nothing.
      - name: Complete the added parts with dotnet cleanarch add
        if: matrix.first_app || matrix.first_presentation || matrix.wasm_app
        working-directory: ${{ runner.temp }}/generated
        env:
          FIRST_APP: ${{ matrix.first_app }}
          FIRST_PRESENTATION: ${{ matrix.first_presentation }}
          WASM_APP: ${{ matrix.wasm_app }}
        run: |
          set -euo pipefail
          if [ -n "$FIRST_APP" ]; then
            dotnet cleanarch add web-app --name Site --framework "$(sed -nE 's/.*--framework ([^ ]+).*/\1/p' <<< "$FIRST_APP")" --yes
            grep -A3 '^include:' docker-compose.yml
          fi
          if [ -n "$FIRST_PRESENTATION" ]; then
            dotnet cleanarch add presentation --name Portal --yes
          fi
          if [ -n "$WASM_APP" ]; then
            dotnet cleanarch add web-app --name WasmSite --framework blazor-wasm --port 8089 --yes
            if again=$(dotnet cleanarch add web-app --name WasmSite --framework blazor-wasm --port 8089 --yes 2>&1); then
              echo "::error title=Not idempotent::A second add of a complete app succeeded."
              echo "$again"
              exit 1
            fi
            if ! grep -q 'src/Web/apps/WasmSite is joined and created already' <<< "$again"; then
              echo "::error title=Not idempotent::A second add of a complete app failed without saying it is complete."
              echo "$again"
              exit 1
            fi
          fi

      # bootstrap creates each part still holding its scaffold.json, sorts the usings, which depend on the generated name (docs/getting-started/first-run.md), writes the documentation index, the OpenAPI reference and the .NET client, and creates each context's first migration. A using it removes is one the template left unused in this shape, which fails the build of a project built before its bootstrap.
      - name: Bootstrap
        working-directory: ${{ runner.temp }}/generated
        env:
          AUTH_CONTEXT: ${{ matrix.auth_context }}
        run: |
          set -euo pipefail
          if [ -n "$(find src/Infrastructure -path '*/Migrations/*' -name '*.cs')" ]; then
            echo "::error title=Migrations shipped::The generated project carries a migration; bootstrap creates the first one."
            exit 1
          fi
          dotnet cleanarch bootstrap
          removed=$(LC_ALL=C comm -23 "${{ runner.temp }}/usings-generated.txt" <(find . \( -name .git -o -name bin -o -name obj -o -name node_modules \) -prune -o -name '*.cs' -print0 \
            | xargs -0 -r awk 'FNR == 1 { sub(/^\357\273\277/, "") } { sub(/\r$/, "") } /^(global )?using [A-Za-z_][^(;]*;$/ { print FILENAME ": " $0 }' \
            | LC_ALL=C sort))
          if [ -n "$removed" ]; then
            echo "::error title=Unused using::The template writes a using this shape never reads, which IDE0005 removed: put each under the condition of the lines that read it."
            echo "$removed"
            exit 1
          fi
          contexts=(Persistence)
          if [ "$AUTH_CONTEXT" = "true" ]; then
            contexts+=(Auth)
          fi
          for context in "${contexts[@]}"; do
            snapshots=$(find src/Infrastructure -path "*.Infrastructure.$context/Migrations/*ModelSnapshot.cs" | wc -l)
            [ "$snapshots" -eq 1 ] || { echo "::error title=No initial migration::$context has $snapshots model snapshots."; exit 1; }
          done
          if [ -n "$(find src/Presentation src/Web/apps -name scaffold.json 2>/dev/null)" ]; then
            echo "::error title=Part not created::A part still holds its scaffold.json after bootstrap."
            exit 1
          fi
          dotnet cleanarch docs-index --check

      - name: The project's tool knows the project
        working-directory: ${{ runner.temp }}/generated
        run: dotnet cleanarch | tee /dev/stderr | grep -F "Sample.Generated.Project, generated from CleanArch.WebApi.Templates"

      # A second bootstrap creates no migration and changes no file: what is done stays done, and what it writes is reproducible.
      - name: Assert bootstrap is idempotent
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          tree() { find . \( -name .git -o -name bin -o -name obj -o -name node_modules -o -name TestResults \) -prune -o -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; }
          before=$(tree)
          dotnet cleanarch bootstrap
          if [ "$(tree)" != "$before" ]; then
            echo "::error title=Not idempotent::A second bootstrap changed the tree."
            diff <(echo "$before") <(tree) || true
            exit 1
          fi

      - name: Restore and build the generated project
        working-directory: ${{ runner.temp }}/generated
        run: |
          dotnet restore Sample.Generated.Project.slnx
          dotnet build Sample.Generated.Project.slnx --configuration Release --no-restore

      # A newer version that changes nothing but its number is a version in cleanarch.json, in docs/getting-started/overview.md and in the tool pin of .config/dotnet-tools.json, a file bootstrap edits and so one to merge, so the report on a project as bootstrap leaves it names those and no other file; IDE0055 may rewrite more than the usings, which only a project that went through bootstrap shows. The report writes nothing in the project, and the newer package is this checkout packed again under the next patch version.
      - name: Assert upgrade-report names only the version after bootstrap (defaults leg)
        if: matrix.name == 'defaults'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          fail() { echo "::error title=Upgrade report::$1"; exit 1; }
          current=$(jq -r .template.version cleanarch.json)
          core=${current%%[-+]*}
          next="${core%.*}.$(( ${core##*.} + 1 ))"
          copy="${{ runner.temp }}/template-next"
          cp -a "$GITHUB_WORKSPACE/." "$copy"
          rm -rf "$copy/.git"
          sed -i "/\"templateVersion\"/,/\"value\"/ s/\"value\": \"[^\"]*\"/\"value\": \"$next\"/" "$copy/.template.config/template.json"
          grep -qE "\"value\": \"$next\"" "$copy/.template.config/template.json" || fail "The copy of the template does not hold version $next."
          (cd "$copy" && dotnet pack .template.config/TemplatePackage.csproj --configuration Release --output "${{ runner.temp }}/package-next")
          dotnet cleanarch upgrade-report --to "$next" --source "${{ runner.temp }}/package" --source "${{ runner.temp }}/package-next" --json "${{ runner.temp }}/upgrade-report.json"
          jq -e --arg current "$current" --arg next "$next" '
            .from == $current and .to == $next
            and ([.take[].path] == ["docs/getting-started/overview.md"])
            and (.provenance != null)
            and ([.merge[].path] == [".config/dotnet-tools.json"])
            and ([.added, .removed, .scaffolds, .decisions] | all(length == 0))
          ' "${{ runner.temp }}/upgrade-report.json" > /dev/null || {
            jq '{take: [.take[].path], merge: [.merge[].path], added: [.added[].path], removed: [.removed[].path], scaffolds, decisions, provenance}' "${{ runner.temp }}/upgrade-report.json"
            fail "Bumping the version alone reports more than the version in cleanarch.json, docs/getting-started/overview.md and the tool pin: a file bootstrap rewrote, or a generator that draws a value."
          }
          own=$(jq -r '.own | length' "${{ runner.temp }}/upgrade-report.json")
          echo "::notice title=Upgrade report::$own file(s) of the project's own, in neither generation."

      # The build holds the style it can see and bootstrap must leave whitespace and encoding unchanged on every shape; the rules that need a compilation, using order among them, run on the defaults shape, as ci.yml runs them on the template.
      - name: Check the formatting the build does not
        working-directory: ${{ runner.temp }}/generated
        env:
          LEG: ${{ matrix.name }}
        run: |
          if [ "$LEG" = defaults ]; then
            dotnet cleanarch format --check
          else
            dotnet format whitespace --folder . --verify-no-changes --verbosity normal
          fi

      # Selected by the csproj, not by a name pattern: IsTestProject set and no Testcontainers or Aspire.Hosting.Testing reference, which leaves the end-to-end suite out, and on Linux no Windows target framework, which the log captured whole must name before the run and after it.
      - name: Run the Docker-free tests
        working-directory: ${{ runner.temp }}/generated
        env:
          OPTIONS: ${{ matrix.options }}
          FIRST_PRESENTATION: ${{ matrix.first_presentation }}
        run: |
          set -euo pipefail
          log="${{ runner.temp }}/docker-free-tests.log"
          dotnet cleanarch test --no-integration --configuration Release 2>&1 | tee "$log"
          windows_only=$(grep -rlE --include='*.csproj' '<TargetFramework>net[0-9.]+-windows' tests || true)
          if [[ "$OPTIONS $FIRST_PRESENTATION" == *wpf* && -z "$windows_only" ]]; then
            echo "::error title=No Windows-only tests::A project with the WPF app holds no test project on a Windows target framework."
            exit 1
          fi
          for project in $windows_only; do
            framework=$(sed -nE 's#.*<TargetFramework>([^<]+)</TargetFramework>.*#\1#p' "$project")
            line="Skipped $(dirname "$project"): it targets $framework and runs on Windows alone."
            announced=$(grep -cF "$line" "$log" || true)
            if [ "$announced" -ne 2 ]; then
              echo "::error title=Skipped tests not named::test --no-integration named $(dirname "$project") $announced times, not before and after the run."
              exit 1
            fi
          done

      # The projects the Docker-free step leaves out, against the runner's Docker: the HTTP surface the options change most.
      - name: Run the integration tests (Testcontainers)
        if: matrix.integration == 'true'
        working-directory: ${{ runner.temp }}/generated
        env:
          DATABASE: ${{ matrix.database || 'postgresql' }}
        run: |
          set -euo pipefail
          mapfile -t projects < <(grep -r --include='*.csproj' -l 'Testcontainers' tests | sort)
          # A SQLite project without files starts no container: its integration suites ran with the Docker-free tests.
          if [ "${#projects[@]}" -eq 0 ] && [ "$DATABASE" = "sqlite" ]; then
            exit 0
          fi
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error title=No integration projects::No test project of the generated project references Testcontainers."
            exit 1
          fi
          for project in "${projects[@]}"; do
            echo "::group::$project"
            dotnet test --project "$project" --configuration Release --no-build --output Detailed
            echo "::endgroup::"
          done

      # The app host started whole on the runner's Docker: every resource it declares healthy or running, and the API answering /health.
      - name: Start the app host (aspire leg)
        if: matrix.aspire == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          mapfile -t projects < <(grep -r --include='*.csproj' -l 'Aspire.Hosting.Testing' tests | sort)
          if [ "${#projects[@]}" -ne 1 ]; then
            echo "::error title=No app host test::The generated project holds ${#projects[@]} test projects that reference Aspire.Hosting.Testing, where --aspire true writes one."
            exit 1
          fi
          dotnet test --project "${projects[0]}" --configuration Release --no-build --output Detailed

      # The generated project's own task, every suite again under coverage: a shape far from this checkout's must hold the same coverage.minimum, never lowered to pass.
      - name: Measure the coverage against coverage.minimum (coverage leg)
        if: matrix.coverage == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: dotnet cleanarch coverage --configuration Release

      # The generated project's own task: its Compose stack from .env.example, the suite, then the stack removed.
      - name: Run the end-to-end suite (end-to-end legs)
        if: matrix.end_to_end == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: dotnet cleanarch end-to-end

      - name: Assert no context has a pending model change
        working-directory: ${{ runner.temp }}/generated
        env:
          AUTH_CONTEXT: ${{ matrix.auth_context }}
        run: |
          set -euo pipefail
          contexts=(Persistence)
          if [ "$AUTH_CONTEXT" = "true" ]; then
            contexts+=(Auth)
          fi
          for context in "${contexts[@]}"; do
            project=$(find src/Infrastructure -maxdepth 1 -type d -name "*.Infrastructure.$context")
            if [ -z "$project" ]; then
              echo "::error title=Missing project::No Infrastructure.$context project was generated."
              exit 1
            fi
            echo "::group::$context"
            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project "$project" --configuration Release --no-build
            echo "::endgroup::"
          done

      # The documentation indexes the generated tree carries, as docs-index --check holds them.
      - name: Check the generated project's documentation indexes
        working-directory: ${{ runner.temp }}/generated
        run: dotnet cleanarch docs-index --check

      # add feature writes a feature, makes the edits that compose it, adds its migration and rewrites the OpenAPI reference, the record and the aggregate with a field of every type; the solution then builds with warnings as errors and the architecture and feature tests pass, and where the leg has Docker the integration tests --fields wrote pass against the database. The aggregate one takes five more use cases from add use-case, which adds each action, two with typed inputs, and refuses the record ones. With the four together, add field adds a required field with its default, another and a nullable one to the record and to the aggregate with fields, then adds their migration with the defaults, and Invoices takes a setting and an event, before the same proof. The documentation indexes stay current with four features present, and remove feature --apply takes them out of the committed tree, leaving each feature's migrations alone.
      - name: Assert the feature generator round trip leaves the tree untouched
        if: matrix.generator == 'true'
        working-directory: ${{ runner.temp }}/generated
        env:
          INTEGRATION: ${{ matrix.integration }}
        run: |
          set -euo pipefail
          fail() { echo "::error title=Generator round trip::$1"; exit 1; }
          git init --quiet
          git add -A
          git -c user.name=acceptance -c user.email=acceptance@localhost commit --quiet -m generated
          cases=(
            "Orders Order --access owner --deletion delete --fields=Title:string(120),Nickname:string(40)?,Notes:text?,Summary:text(500),Count:int>=0<=1000,Total:long?>-5,Budget:decimal(12,2)>=0,Ratio:decimal(5,4)?,Paid:bool,Due:DateOnly,StartsAt:DateTimeOffset,Reference:Guid?"
            "Tags Tag --access shared"
            "Invoices Invoice --access owner --deletion anonymise --model aggregate --concurrency etag --fields=Title:string(120),Nickname:string(40)?,Notes:text?,Summary:text(500),Count:int>=0<=1000,Total:long?>-5,Budget:decimal(12,2)>=0,Ratio:decimal(5,4)?,Paid:bool,Due:DateOnly,StartsAt:DateTimeOffset,Reference:Guid?"
            "Receipts Receipt --access owner --deletion delete --model aggregate --concurrency etag --operations get,list,create"
          )
          mapfile -t docker_free < <(grep -rl --include='*.csproj' '<IsTestProject>true</IsTestProject>' tests | xargs -r grep -L -e 'Testcontainers' -e 'Aspire.Hosting.Testing' | sort)
          mapfile -t architecture < <(find tests/Architecture -name '*.csproj')
          write() {
            local log="${{ runner.temp }}/add-feature-${1%% *}.log"
            local -
            set -f
            # shellcheck disable=SC2086
            dotnet cleanarch add feature $1 > "$log" 2>&1 || { cat "$log"; fail "add feature $1 failed."; }
            grep -q 'Feature page: docs/features/' "$log" || fail "add feature $1 named no feature page."
            [ -f ".feature-manifest/${1%% *}.json" ] || fail "add feature $1 left no manifest."
            jq -e '.edits | length > 0' ".feature-manifest/${1%% *}.json" > /dev/null || fail "add feature $1 recorded no edit in its manifest."
            compgen -G "src/Infrastructure/*.Infrastructure.Persistence/Migrations/*_Add${1%% *}.cs" > /dev/null || fail "add feature $1 added no migration."
          }
          extend() {
            local feature type
            read -r feature type _ <<< "$1"
            if [[ "$1" != *"--model aggregate"* ]]; then
              if dotnet cleanarch add use-case "$feature" "Archive${type}" --kind command > "${{ runner.temp }}/add-use-case.log" 2>&1; then
                fail "add use-case accepted $feature, a feature of the simple shape."
              fi
              return
            fi
            local log
            for usecase in "Approve${type} --kind command" "Get${type}Totals --kind query" "CloseOverdue${feature} --kind command --input none" "Find${feature}ByName --kind query --input=Name:string,MaxCount:int" "Retag${type} --kind command --input=id,Tags:IReadOnlyList<string>"; do
              log="${{ runner.temp }}/add-use-case-$feature-${usecase%% *}.log"
              # shellcheck disable=SC2086
              dotnet cleanarch add use-case "$feature" $usecase > "$log" 2>&1 || { cat "$log"; fail "add use-case $feature $usecase failed."; }
            done
          }
          widen() {
            local feature log migration
            read -r feature _ <<< "$1"
            [[ "$1" == *"--fields"* ]] || return 0
            log="${{ runner.temp }}/add-field-$feature.log"
            dotnet cleanarch add field "$feature" "Code:string(20)='none', Rank:int>=1=1, Weight:decimal(8,3)?" > "$log" 2>&1 || { cat "$log"; fail "add field $feature failed."; }
            grep -q 'Breaking change: Code is required' "$log" || fail "add field $feature did not say that a required field breaks the clients."
            jq -e '.addedFields | length == 1' ".feature-manifest/$feature.json" > /dev/null || fail "add field $feature recorded no addition in its manifest."
            migration=$(compgen -G "src/Infrastructure/*.Infrastructure.Persistence/Migrations/*_AddCodeAnd2MoreFieldsTo$feature.cs") || fail "add field $feature added no migration."
            grep -q 'defaultValue: "none"' "$migration" && grep -q 'defaultValue: 1)' "$migration" || fail "add field $feature did not give the stored rows each default."
          }
          prove() {
            local feature home persistence
            dotnet build ./*.slnx --configuration Release --no-restore -warnaserror || fail "the solution does not compile once add feature has composed $*."
            dotnet test --project "${architecture[0]}" --configuration Release --no-build --output Detailed || fail "the architecture tests fail once add feature has composed $*."
            for feature in "$@"; do
              mapfile -t homes < <(for home in "${docker_free[@]}"; do [ -n "$(find "$(dirname "$home")" -type d -path "*/Features/$feature" -not -path '*/bin/*' -not -path '*/obj/*')" ] && echo "$home"; done)
              [ "${#homes[@]}" -gt 0 ] || fail "add feature $feature wrote no test in a Docker-free test project."
              for home in "${homes[@]}"; do
                dotnet test --project "$home" --configuration Release --no-build --output Detailed --filter-namespace "*.Features.$feature.*"
              done
            done
            persistence=$(find src/Infrastructure -maxdepth 1 -type d -name '*.Infrastructure.Persistence')
            dotnet ef migrations has-pending-model-changes --project "$persistence" --startup-project "$persistence" --configuration Release --no-build || fail "the migrations add feature added for $* do not hold its model."
          }
          # add setting writes a section with a default, so no secret, and add event an event nothing consumes: both record their files and edits in the manifest of Invoices, which remove feature then undoes with the feature.
          settle() {
            local log="${{ runner.temp }}/add-setting.log"
            dotnet cleanarch add setting Invoices InvoiceLimits --keys "MaxLines:int(1..500)=100" > "$log" 2>&1 || { cat "$log"; fail "add setting Invoices failed."; }
            log="${{ runner.temp }}/add-event.log"
            dotnet cleanarch add event Invoices InvoiceApprovedDomainEvent --unconsumed "Nothing reacts to an approved invoice yet" > "$log" 2>&1 || { cat "$log"; fail "add event Invoices failed."; }
            jq -e '[.files[].path] | any(endswith("/InvoiceLimitsOptions.cs")) and any(endswith("/InvoiceApprovedDomainEvent.cs"))' .feature-manifest/Invoices.json > /dev/null || fail "add setting or add event did not record its files in the manifest of Invoices."
            jq -e '[.edits[].path] | any(endswith("/appsettings.json")) and any(endswith("/DomainEventTests.cs"))' .feature-manifest/Invoices.json > /dev/null || fail "add setting or add event did not record its edits in the manifest of Invoices."
          }
          commit() {
            git add -A
            git -c user.name=acceptance -c user.email=acceptance@localhost commit --quiet -m "$1"
          }
          # remove feature --apply takes each feature out of a committed tree, edited or not, last in first out; the tree then differs from the commit generation made by each feature's Add and Remove migrations and the migrations add field added alone, so the model snapshot, the references and every file an edit touched read as they did there.
          remove() {
            local feature log names widened
            widened=$(jq -s '[.[] | (.addedFields // []) | length] | add' .feature-manifest/*.json)
            for feature in "$@"; do
              log="${{ runner.temp }}/remove-feature-$feature.log"
              dotnet cleanarch remove feature "$feature" > "$log" 2>&1 || { cat "$log"; fail "remove feature $feature failed."; }
              grep -q 'Blockers: none.' "$log" || { cat "$log"; fail "remove feature $feature reported a blocker."; }
              dotnet cleanarch remove feature "$feature" --apply > "$log" 2>&1 || { cat "$log"; fail "remove feature $feature --apply failed."; }
              commit "remove $feature"
            done
            names=$(IFS='|'; echo "$*")
            unexpected=$(git diff --name-status "$start" HEAD | grep -Ev "^A[[:space:]]+$persistence/Migrations/[0-9]+_(Add|Remove)([A-Za-z0-9]*To)?($names)(\.Designer)?\.cs$" || true)
            if [ -n "$unexpected" ]; then
              echo "$unexpected"
              fail "remove feature $* left the tree other than the commit generation made, the migrations of each feature aside."
            fi
            [ "$(git diff --name-only "$start" HEAD | wc -l)" -eq $((4 * $# + 2 * widened)) ] || fail "remove feature $* did not add a Remove migration beside each Add one and leave each add field migration, each with its designer file."
          }
          start=$(git rev-parse HEAD)
          persistence=$(find src/Infrastructure -maxdepth 1 -type d -name '*.Infrastructure.Persistence')
          # Each case is proved alone, then the next starts from the commit generation made; the four are removed together below, which takes each shape out, the last owner feature with the account-deletion files among them.
          for one in "${cases[@]}"; do
            echo "::group::$one"
            write "$one"
            extend "$one"
            prove "${one%% *}"
            git reset --quiet --hard "$start"
            git clean -fdq
            echo "::endgroup::"
          done
          echo "::group::all four together, with a setting and an event, removed last in first out"
          written=()
          for one in "${cases[@]}"; do
            write "$one"
            extend "$one"
            written=("${one%% *}" "${written[@]}")
          done
          for one in "${cases[@]}"; do
            widen "$one"
          done
          settle
          prove "${written[@]}"
          if [ "$INTEGRATION" = "true" ]; then
            integration=$(find tests/Integration -name '*.Api.IntegrationTests.csproj')
            dotnet test --project "$integration" --configuration Release --no-build --output Detailed --filter-namespace "*.IntegrationTests.Features.*" || fail "the integration tests add feature --fields wrote fail against the database."
          fi
          dotnet cleanarch docs-index --check
          commit "the four features"
          remove "${written[@]}"
          dotnet build ./*.slnx --configuration Release --no-restore -warnaserror || fail "the solution does not compile once remove feature has removed ${written[*]}."
          dotnet ef migrations has-pending-model-changes --project "$persistence" --startup-project "$persistence" --configuration Release --no-build || fail "the Remove migrations do not hold the model remove feature left."
          echo "::endgroup::"

      # A generated project holds one app, so it receives that shape's lockfile, not this checkout's union one.
      - name: Assert each generated web shape's lockfile is current
        if: matrix.web == 'true'
        run: dotnet run tools/WebLockfiles.cs --check

      # The added app joins the stack by the lines its README lists, then is created, both by dotnet cleanarch add; the options stay unquoted, being several arguments.
      - name: Add a second app with cleanarch-webapp
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        env:
          SECOND_APP: ${{ matrix.second_app || '--framework placeholder' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dotnet new cleanarch-webapp -n BackOffice --port 8082 $SECOND_APP
          leaked=$(grep -rIl -e PlaceholderSite -e placeholder-site -e PLACEHOLDER_SITE -e FrameworkSite -e framework-site -e FRAMEWORK_SITE src/Web/apps/BackOffice || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Item template token leaked::$leaked"
            exit 1
          fi
          given() { sed -nE "s/.*--$1 ([^ ]+).*/\\1/p" <<< "$SECOND_APP"; }
          audience=$(given audience)
          rendering=$(given rendering)
          dotnet cleanarch add web-app --name BackOffice --framework "$(given framework)" --audience "${audience:-public}" --rendering "${rendering:-spa}" --port 8082 --yes
          grep -A3 '^include:' docker-compose.yml

      # Each entry is Name:port:framework, then :ssr for an app rendered on the server; the app joins the stack by the lines its README lists, then is created, both by dotnet cleanarch add.
      - name: Add every other starter with cleanarch-webapp
        if: matrix.more_apps
        working-directory: ${{ runner.temp }}/generated
        env:
          MORE_APPS: ${{ matrix.more_apps }}
        run: |
          set -euo pipefail
          for app in $MORE_APPS; do
            IFS=: read -r name port framework rendering <<< "$app"
            dotnet new cleanarch-webapp -n "$name" --framework "$framework" --rendering "${rendering:-spa}" --port "$port" --scope sample-generated-project
            leaked=$(grep -rIl -e FrameworkSite -e framework-site -e FRAMEWORK_SITE "src/Web/apps/$name" || true)
            if [ -n "$leaked" ]; then
              echo "::error title=Item template token leaked::$leaked"
              exit 1
            fi
            dotnet cleanarch add web-app --name "$name" --framework "$framework" --rendering "${rendering:-spa}" --port "$port" --yes
          done
          grep -A9 '^include:' docker-compose.yml
          grep '^WEB_' .env.example

      # Each add created its app by its official CLI, then ran pnpm install and pnpm api: no app is left to create.
      - name: Assert every web app is created
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          if [ -n "$(find src/Web/apps -name scaffold.json -o -name overlay -type d)" ]; then
            echo "::error title=App not created::An app still holds its scaffold.json or overlay/."
            exit 1
          fi

      - name: Install, lint, test and build the web workspace
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated/src/Web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      # React Router's builder keeps its page in a client folder of dist, and a server-rendered app's build is its server; every other starter writes the page at the root.
      - name: Assert every app with a build script builds its page
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          missing = [manifest.parent for manifest in sorted(pathlib.Path("src/Web/apps").glob("*/package.json"))
                     if "build" in json.loads(manifest.read_text(encoding="utf-8")).get("scripts", {})
                     and not any((manifest.parent / "dist" / built).is_file() for built in ("index.html", "client/index.html", "server/server.mjs"))]
          for app in missing:
              print(f"::error title=No built page::{app} has a build script and no index.html in dist or dist/client, nor a server in dist/server.")
          sys.exit(1 if missing else 0)
          PY

      # The workspace's globs pick the package up: no file but its own is edited, and the lockfile gains its importer.
      - name: Add a package with cleanarch-webpackage
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          dotnet new cleanarch-webpackage -n tokens --scope sample-generated-project
          leaked=$(grep -rIl -e app-template -e placeholder-package src/Web/packages/tokens || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Item template token leaked::$leaked"
            exit 1
          fi
          dotnet cleanarch add web-package --name tokens --yes
          cd src/Web
          pnpm install --no-frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      # The Docker-free step held cleanarch.json to the tree before the apps and the package added since; each add recorded those too.
      - name: Assert cleanarch.json records every part added
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: dotnet test --project tests/Architecture/SGP.Architecture.Tests --configuration Release --no-build -- --filter-class '*ProjectFileTests'

      # A bootstrap once every part is added creates nothing and changes nothing: the client is reproducible and created apps are left alone.
      - name: Assert bootstrap leaves the added apps alone
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          git init --quiet
          git add -A
          git -c user.name=acceptance -c user.email=acceptance@localhost commit --quiet -m generated
          dotnet cleanarch bootstrap
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Not idempotent::A bootstrap after the apps were added changed the tree."
            git status --porcelain
            git diff --stat
            exit 1
          fi

      # After the web steps, so a web leg's lockfile exists and git's ignore rules hide node_modules; the tool stays in this checkout.
      - name: Assert every path the generated pages cite exists
        run: dotnet run tools/CheckDocPaths.cs "${{ runner.temp }}/generated"

      - name: Build the images and start the stack
        if: matrix.web == 'true' || matrix.worker == 'true' || matrix.mcp == 'true'
        working-directory: ${{ runner.temp }}/generated
        env:
          STACK_ENV: ${{ matrix.stack_env }}
        run: |
          set -euo pipefail
          cp .env.example .env
          if [ -n "$STACK_ENV" ]; then
            printf '%b\n' "$STACK_ENV" >> .env
          fi
          docker compose build
          docker compose up --detach --wait --wait-timeout 300

      # Each web app answers on the port .env.example gives it, serves its page with the page headers, and relays to the API. An inline script runs only by its hash or its response's nonce in the served script-src, and no two responses share a nonce; an event-handler attribute never runs. A server-rendered app that keeps sessions refuses a POST without X-CSRF itself, and with an external provider refuses a sign-in callback it did not start and sends a sign-in to the provider, or answers 502 while the provider cannot be reached. A page that signs in at the provider may reach its origin. A presentation project answers / with a page, or, where it authenticates, with a redirect to its own sign-in page; under local accounts, which its .env shows by the JWT_KEY it holds, that page holds a form.
      - name: Assert every web app serves its page and relays to the API
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          fail() { echo "::error title=Web app::$1"; exit 1; }
          mapfile -t ports < <(grep -oE '^WEB_[A-Z0-9_]+_HOST_PORT=[0-9]+' .env | cut -d= -f2)
          [ "${#ports[@]}" -gt 0 ] || fail "No WEB_*_HOST_PORT in .env.example."
          for port in "${ports[@]}"; do
            base="http://127.0.0.1:${port}"
            curl -fsS -D headers.txt -o page.html "$base/"
            curl -fsS -D headers.again.txt -o page.again.html "$base/"
            headers=$(cat headers.txt)
            echo "$headers"
            python3 - "$base" headers.txt page.html headers.again.txt page.again.html <<'PY' || fail "$base/ runs an inline script its Content-Security-Policy allows neither by hash nor by nonce, or repeats a nonce."
          import base64, hashlib, re, sys
          def read(headers, page):
              headers, page = open(headers, encoding="utf-8").read(), open(page, encoding="utf-8").read()
              policy = next((line.split(":", 1)[1] for line in headers.splitlines() if line.lower().startswith("content-security-policy:")), "")
              allowed = next((directive.split()[1:] for directive in policy.split(";") if directive.split()[:1] == ["script-src"]), [])
              return page, allowed
          base = sys.argv[1]
          page, allowed = read(sys.argv[2], sys.argv[3])
          _, allowed_again = read(sys.argv[4], sys.argv[5])
          inline = [(attributes, body) for attributes, body in re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", page, re.I | re.S)
                    if not re.search(r"\ssrc\s*=", attributes, re.I) and not re.search(r"\stype\s*=\s*[\"']?application/(ld\+)?json", attributes, re.I) and body.strip()]
          def nonce(attributes):
              found = re.search(r"\snonce\s*=\s*[\"']([^\"']+)[\"']", attributes, re.I)
              return f"'nonce-{found.group(1)}'" if found else None
          refused = [body for attributes, body in inline
                     if f"'sha256-{base64.b64encode(hashlib.sha256(body.encode()).digest()).decode()}'" not in allowed and nonce(attributes) not in allowed]
          nonces = {source for source in allowed if source.startswith("'nonce-")}
          repeated = nonces & {source for source in allowed_again if source.startswith("'nonce-")}
          handlers = len(re.findall(r"<[^>]*\son[a-z]+\s*=", page, re.I))
          styles = sum(1 for body in re.findall(r"<style\b[^>]*>(.*?)</style\s*>", page, re.I | re.S) if body.strip())
          attributes = len(re.findall(r"<[^>]*\sstyle\s*=", page, re.I))
          print(f"{base}/: {len(inline)} inline script(s), {len(refused)} allowed neither by hash nor by nonce, {len(nonces)} nonce(s), {len(repeated)} repeated, {handlers} event-handler attribute(s), {styles} style element(s), {attributes} style attribute(s).")
          sys.exit(1 if refused or repeated or handlers else 0)
          PY
            grep -qi '^content-security-policy:.*frame-ancestors' <<< "$headers" || fail "$base/ has no CSP with frame-ancestors."
            if grep -q 'AuthenticationService.js' page.html; then
              provider=$(grep -oE '^EXTERNAL_AUTH_AUTHORITY=https?://[^/]+' .env | cut -d= -f2)
              grep -qiE "^content-security-policy:.*connect-src 'self' ${provider};.*frame-src 'self' ${provider}" <<< "$headers" || fail "$base/ signs in at ${provider}, which its Content-Security-Policy does not let the page reach."
            fi
            grep -qi '^x-content-type-options: nosniff' <<< "$headers" || fail "$base/ has no X-Content-Type-Options."
            grep -qi '^referrer-policy:' <<< "$headers" || fail "$base/ has no Referrer-Policy."
            grep -qiE '^cache-control: no-(cache|store)' <<< "$headers" || fail "$base/ is cached."
            grep -qi '<html' page.html || fail "$base/ served no page."
            curl -fsS "$base/health" > /dev/null || fail "$base/health is not relayed to the API."
            status=$(curl -sS -o relay.json -D relay.headers -w '%{http_code}' "$base/api/v1/relay-check")
            case "$status" in
              404) code=route.notFound ;;
              401) code=auth.required ;;
              *) fail "$base/api/ answered $status instead of the API's 404, or its 401 under authentication." ;;
            esac
            grep -qi '^content-type: application/problem+json' relay.headers || fail "$base/api/ was not answered by the API."
            grep -q "\"code\":\"$code\"" relay.json || fail "$base/api/ answered $status without the API's $code problem code."
            if [ "$code" = auth.required ] && grep -qi "^content-security-policy:.*'nonce-" <<< "$headers"; then
              status=$(curl -sS -o csrf.json -w '%{http_code}' -X POST "$base/api/v1/relay-check")
              [ "$status" = 403 ] && grep -q '"code":"session.csrfHeaderRequired"' csrf.json || fail "$base/ keeps a session, yet its relay answered $status, not its own 403, to a POST without X-CSRF."
              status=$(curl -sS -o csrf.json -w '%{http_code}' -X POST -H 'X-CSRF: 1' "$base/api/v1/relay-check")
              [ "$status" = 401 ] || fail "$base/ refused a POST that carries X-CSRF: its relay answered $status instead of the API's 401."
              if grep -qE '^EXTERNAL_AUTH_AUTHORITY=https://' .env; then
                status=$(curl -sS -o callback.json -w '%{http_code}' "$base/session/callback?code=forged&state=forged")
                [ "$status" = 400 ] && grep -q '"code":"session.signInStateInvalid"' callback.json || fail "$base/ answered $status, not its own 400, to a sign-in callback it did not start."
                status=$(curl -sS -o sign-in.json -D sign-in.headers -w '%{http_code}' "$base/session/sign-in")
                provider=$(grep -oE '^EXTERNAL_AUTH_AUTHORITY=https://[^/]+' .env | cut -d= -f2)
                case "$status" in
                  302) grep -qi "^location: ${provider}/" sign-in.headers || fail "$base/session/sign-in redirected elsewhere than ${provider}." ;;
                  502) grep -q '"code":"session.providerUnreachable"' sign-in.json || fail "$base/session/sign-in answered 502 without its own code." ;;
                  *) fail "$base/session/sign-in answered $status instead of a redirect to ${provider}, or 502 while it cannot be reached." ;;
                esac
              fi
            fi
            echo "Web app on $port: page, headers, /health and /api/ relay verified."
          done
          mapfile -t presentations < <(grep -oE '^PRESENTATION_[A-Z0-9_]+_HOST_PORT=[0-9]+' .env | grep -v '^PRESENTATION_MCP_' | cut -d= -f2)
          for port in "${presentations[@]}"; do
            base="http://127.0.0.1:${port}"
            status=$(curl -sS -o page.html -D page.headers -w '%{http_code}' "$base/")
            case "$status" in
              200) grep -qi '<html' page.html || fail "The presentation project on $port served no page." ;;
              302)
                location=$(sed -n 's/^[Ll]ocation: *//p' page.headers | tr -d '\r')
                [[ "$location" =~ ^(http://[^/]+)?/account/sign-in(\?.*)?$ ]] || fail "The presentation project on $port redirected / to ${location}, not to its sign-in page."
                ;;
              *) fail "The presentation project on $port answered $status to /, not a page or a redirect to its sign-in page." ;;
            esac
            if grep -q '^JWT_KEY=' .env; then
              curl -fsS -o sign-in.html "$base/account/sign-in" || fail "The presentation project on $port does not serve its sign-in page."
              grep -qi '<form' sign-in.html || fail "The presentation project on $port serves a sign-in page without a form."
            fi
            curl -fsS "$base/health" > /dev/null || fail "The presentation project on $port does not answer /health."
            echo "Presentation project on $port: page or sign-in redirect, sign-in form under local accounts, and /health verified."
          done

      # The curl checks above read headers and bytes; only a browser reports what it blocks or breaks. Chromium is cached by the Playwright release the project's lockfile resolves, since another release looks for another build; the install runs on a hit too, for the system libraries, and downloads nothing it holds.
      - name: Find the Playwright release (web legs)
        id: playwright
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated/src/Web
        run: echo "version=$(pnpm --filter '*browser-smoke' exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium (web legs)
        if: matrix.web == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium (web legs)
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated/src/Web
        run: pnpm --filter '*browser-smoke' exec playwright install --only-shell --with-deps chromium

      # Every app cleanarch.json records, on the port .env gives it: its page loads, the browser reports no Content-Security-Policy violation, console error or uncaught exception, and a call through its /api/ relay reaches the API.
      - name: Drive every web app in Chromium (web legs)
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated/src/Web
        run: pnpm --filter '*browser-smoke' smoke

      # The worker runs its first maintenance pass as it starts; the API, which leaves the jobs to it, starts none. Each verdict greps logs captured whole: grep -q closing a pipe early fails the pipeline under pipefail, so a logged pass would read as none.
      - name: Assert the worker runs the jobs and the API none (worker legs)
        if: matrix.worker == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          fail() { echo "::error title=Worker::$1"; docker compose logs --no-color --tail 50 worker; exit 1; }
          attempt=0
          until grep -q 'The pass over .* completed' <<< "$(docker compose logs --no-color worker)"; do
            [ "$(docker compose ps --status running --quiet worker | wc -l)" -eq 1 ] || fail "The worker stopped before it logged a completed pass."
            attempt=$((attempt + 1))
            [ "$attempt" -lt 60 ] || fail "The worker logged no completed pass within two minutes of the stack being up."
            sleep 2
          done
          [ "$(docker compose ps --status running --quiet worker | wc -l)" -eq 1 ] || fail "The worker is not running."
          if grep -qE 'Maintenance job starting|The pass over .* is starting' <<< "$(docker compose logs --no-color api)"; then
            echo "::error title=Worker::The API started a job loop, which the worker runs."
            exit 1
          fi
          echo "The worker completed a pass; the API runs no job."

      # The MCP server answers its health and refuses a call without a credential. Under an external provider its 401 names its resource metadata, which names the provider; under local accounts the seeded administrator creates access keys through the API, a note is written and read back through the tools, a read-only key is refused a write and a revoked key refused outright.
      - name: Assert the MCP server acts for the caller its credential names (mcp legs)
        if: matrix.mcp == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          fail() { echo "::error title=MCP server::$1"; exit 1; }
          port=$(grep -oE '^PRESENTATION_MCP_HOST_PORT=[0-9]+' .env | cut -d= -f2)
          api="http://127.0.0.1:$(grep -oE '^API_HOST_PORT=[0-9]+' .env | cut -d= -f2)"
          base="http://127.0.0.1:${port}"
          curl -fsS "$base/health" > /dev/null || fail "The MCP server on $port does not answer /health."
          call() {
            curl -sS -o mcp.out -w '%{http_code}' -X POST "$base/mcp" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2025-11-25' ${2:+-H "Authorization: Bearer $2"} --data "$1"
          }
          answer() { sed -n 's/^data: //p' mcp.out | grep . || cat mcp.out; }
          tool() { printf '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"%s","arguments":%s}}' "$1" "$2"; }
          status=$(call '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          [ "$status" = 401 ] || fail "A call without a credential answered $status, not 401."
          if grep -q '^MCP_RESOURCE=' .env; then
            resource=$(grep -oE '^MCP_RESOURCE=.*' .env | cut -d= -f2-)
            authority=$(grep -oE '^EXTERNAL_AUTH_AUTHORITY=.*' .env | tail -1 | cut -d= -f2-)
            challenge=$(curl -sS -o /dev/null -D - -X POST "$base/mcp" -H 'Content-Type: application/json' --data '{}' | grep -i '^www-authenticate:' || true)
            echo "$challenge" | grep -q 'resource_metadata="[^"]*/.well-known/oauth-protected-resource/mcp"' || fail "The 401 names no resource metadata: $challenge"
            curl -fsS "$base/.well-known/oauth-protected-resource/mcp" > metadata.json || fail "The MCP server serves no resource metadata."
            jq -e --arg resource "$resource" --arg authority "$authority" '.resource == $resource and (.authorization_servers | index($authority))' metadata.json > /dev/null \
              || fail "The resource metadata does not name $resource and $authority: $(cat metadata.json)"
            echo "MCP server on $port: /health, the 401 and its resource metadata verified."
            exit 0
          fi
          email=$(grep -oE '^SEED_ADMIN_EMAIL=.*' .env | tail -1 | cut -d= -f2-)
          password=$(grep -oE '^SEED_ADMIN_PASSWORD=.*' .env | tail -1 | cut -d= -f2-)
          login=$(jq -n --arg email "$email" --arg password "$password" '{email: $email, password: $password}')
          token=$(curl -fsS -X POST "$api/api/v1/auth/login" -H 'Content-Type: application/json' --data "$login" | jq -er '.tokens.accessToken') \
            || fail "The seeded administrator could not sign in to the API."
          create_key() {
            jq -n --arg name "$1" --argjson scopes "$2" --arg password "$password" '{name: $name, scopes: $scopes, currentPassword: $password}' \
              | curl -fsS -X POST "$api/api/v1/auth/access-keys" -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data @-
          }
          writer=$(create_key acceptance-writer '["read","write"]') || fail "The API created no access key."
          reader=$(create_key acceptance-reader '["read"]') || fail "The API created no read-only access key."
          key=$(echo "$writer" | jq -er '.key'); key_id=$(echo "$writer" | jq -er '.id'); read_key=$(echo "$reader" | jq -er '.key')
          status=$(call '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$token")
          [ "$status" = 401 ] || fail "The API's access token answered $status at the MCP server, not 401."
          status=$(call "$(tool create_note '{"title":"Acceptance","body":"Written through MCP."}')" "$key")
          [ "$status" = 200 ] || fail "create_note answered $status: $(cat mcp.out)"
          note=$(answer | jq -er '.result.structuredContent.id') || fail "create_note returned no note: $(cat mcp.out)"
          status=$(call "$(tool get_note "{\"noteId\":\"$note\"}")" "$read_key")
          [ "$status" = 200 ] && answer | jq -e '.result.structuredContent.body == "Written through MCP."' > /dev/null || fail "get_note with the read-only key did not return the note: $(cat mcp.out)"
          call "$(tool create_note '{"title":"Refused","body":"No."}')" "$read_key" > /dev/null
          answer | jq -e '.error or .result.isError' > /dev/null || fail "The read-only key created a note: $(cat mcp.out)"
          call '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$read_key" > /dev/null
          answer | jq -e '[.result.tools[].name] | index("create_note") | not' > /dev/null || fail "The read-only key lists create_note: $(cat mcp.out)"
          curl -fsS -X DELETE "$api/api/v1/auth/access-keys/$key_id" -H "Authorization: Bearer $token" || fail "The API did not revoke the access key."
          status=$(call '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' "$key")
          [ "$status" = 401 ] || fail "A revoked key answered $status, not 401."
          echo "MCP server on $port: /health, a note written and read through access keys, a read-only key refused a write, a revoked key refused."

      - name: Stack logs on failure
        if: failure() && (matrix.web == 'true' || matrix.worker == 'true' || matrix.mcp == 'true')
        working-directory: ${{ runner.temp }}/generated
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always() && (matrix.web == 'true' || matrix.worker == 'true' || matrix.mcp == 'true')
        working-directory: ${{ runner.temp }}/generated
        run: |
          if [ -f .env ]; then
            docker compose down --volumes
          fi

  # A leg whose runner is windows-latest, run as a Windows user runs the project: from PowerShell, through the tasks, with no Docker, which runs no Linux image there.
  template-windows:
    name: Template acceptance (${{ matrix.name }})
    needs: [changes, pack]
    if: needs.changes.outputs.run_windows_count != '0'
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.run_windows) }}

    # Each step runs one command, so the exit code pwsh returns is that command's.
    defaults:
      run:
        shell: pwsh

    steps:
      # The root files, tools and the acceptance checks alone: the package brings the template, and a starter's deepest test path is longer than Windows' 260 characters.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools
            .template.config/acceptance

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the template package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: template-package
          path: ${{ runner.temp }}/package

      - name: Install the template package
        run: dotnet new install (Get-ChildItem "${{ runner.temp }}/package/*.nupkg").FullName

      - name: Download the project's tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: project-tool
          path: ${{ runner.temp }}/tools

      # The tool restore takes dotnet cleanarch from the sources NuGet knows, the packed one among them.
      - name: Let NuGet find the project's tool
        run: dotnet nuget add source "${{ runner.temp }}/tools" --name project-tool

      - name: Generate a project under a different name
        env:
          OPTIONS: ${{ matrix.options }}
        run: dotnet new cleanarch-webapi -n Sample.Generated.Project -o "${{ runner.temp }}/generated" @("$env:OPTIONS".Split(' ', [StringSplitOptions]::RemoveEmptyEntries))

      - name: Assert cleanarch.json records the leg's options
        env:
          OPTIONS: ${{ matrix.options }}
        run: dotnet run .template.config/acceptance/CheckProjectFile.cs -- "${{ runner.temp }}/generated" Sample.Generated.Project "$env:OPTIONS"

      - name: Assert the template's own name leaked nowhere
        working-directory: ${{ runner.temp }}/generated
        run: |
          $content = Get-ChildItem -Recurse -File -Force | Select-String -Pattern 'AppTemplate', 'app-template' -SimpleMatch -List | ForEach-Object Path
          $paths = Get-ChildItem -Recurse -Force | Where-Object Name -Match 'AppTemplate|app-template|^AT\.' | ForEach-Object FullName
          if ($content -or $paths) {
            Write-Output "::error title=Template name leaked::The generated project still names the template."
            @($content) + @($paths) | Write-Output
            exit 1
          }

      - name: Bootstrap the project
        working-directory: ${{ runner.temp }}/generated
        run: |
          dotnet tool restore
          dotnet cleanarch bootstrap

      - name: The project's tool knows the project
        working-directory: ${{ runner.temp }}/generated
        run: |
          $identity = dotnet cleanarch
          Write-Output $identity
          if (-not ($identity -like 'Sample.Generated.Project, generated from CleanArch.WebApi.Templates*')) { exit 1 }

      - name: Build with warnings as errors
        working-directory: ${{ runner.temp }}/generated
        run: dotnet cleanarch build --configuration Release

      - name: Check the whitespace and encoding bootstrap left
        working-directory: ${{ runner.temp }}/generated
        run: dotnet format whitespace --folder . --verify-no-changes --verbosity normal

      - name: Run the Docker-free tests
        working-directory: ${{ runner.temp }}/generated
        run: dotnet cleanarch test --no-integration --configuration Release

      - name: Check the generated project's documentation indexes
        working-directory: ${{ runner.temp }}/generated
        run: dotnet cleanarch docs-index --check

      - name: Assert every path the generated pages cite exists
        run: dotnet run tools/CheckDocPaths.cs "${{ runner.temp }}/generated"

  # Each leg the change cannot affect reports green under its own name, which the develop ruleset requires.
  skipped:
    name: Template acceptance (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.skip_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.skip) }}

    steps:
      - name: No changed path reaches this leg
        env:
          LEG: ${{ matrix.name }}
        run: echo "No changed path reaches '$LEG'; the job 'Select the acceptance legs' names the rule each path matched."

  # A refused combination must exit non-zero and write nothing.
  template-refusals:
    name: Template refuses unsupported options
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the template package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: template-package
          path: ${{ runner.temp }}/package

      - name: Install the template package
        run: dotnet new install "${{ runner.temp }}"/package/*.nupkg

      - name: Assert each unsupported combination exits non-zero and writes nothing
        run: |
          set -euo pipefail
          refuse() {
            local out="${{ runner.temp }}/refused-$1"
            shift
            if dotnet new cleanarch-webapi -n Sample.Refused -o "$out" "$@"; then
              echo "::error title=Accepted::'dotnet new cleanarch-webapi $*' must be refused."
              exit 1
            fi
            if [ -e "$out" ] && [ -n "$(find "$out" -type f -print -quit)" ]; then
              echo "::error title=Wrote files::'dotnet new cleanarch-webapi $*' was refused but left files behind."
              exit 1
            fi
          }
          refuse alone --auth none
          refuse notes --auth none --examples notes
          refuse admin-web --auth none --examples none --files false --web placeholder --web-audience admin
          refuse avalonia-public --auth none --examples none --files false --presentation avalonia
          refuse mcp-public --auth none --examples none --files false --presentation mcp
          refuse wpf-public --auth none --examples none --files false --presentation wpf
          # Avalonia and WPF both write <Project>.Desktop.
          refuse desktop-twice --presentation avalonia --presentation wpf
          refuse wasm-public --auth none --examples none --files false --web blazor-wasm
          refuse worker-sqlite --database sqlite --presentation api --presentation worker
          # A project without the API runs its jobs in the worker added for it.
          refuse worker-added-sqlite --database sqlite --presentation blazor-server
          # Server rendering needs a starter holding an ssr folder.
          refuse ssr-single-page --auth none --examples none --files false --web vite-react --web-rendering ssr
          # The app host's processes cannot share the SQLite file Compose keeps in a volume.
          refuse aspire-sqlite --database sqlite --aspire true
          # A database value the template does not offer is an invalid choice: refused, with nothing written.
          refuse mysql --database mysql
          # A one-letter name puts w.Api in the folder W.Api, which a solution takes for the same name, and _1 has no initials.
          refuse_name() {
            local out="${{ runner.temp }}/refused-name-$1"
            if dotnet new cleanarch-webapi -n "$1" -o "$out"; then
              echo "::error title=Accepted::'dotnet new cleanarch-webapi -n $1' must be refused."
              exit 1
            fi
            if [ -e "$out" ] && [ -n "$(find "$out" -type f -print -quit)" ]; then
              echo "::error title=Wrote files::'dotnet new cleanarch-webapi -n $1' was refused but left files behind."
              exit 1
            fi
          }
          refuse_item() {
            local name=$1
            shift
            local out="${{ runner.temp }}/refused-name-$name-$1"
            mkdir -p "$out"
            if (cd "$out" && dotnet new "$@" --project-name "$name"); then
              echo "::error title=Accepted::'dotnet new $* --project-name $name' must be refused."
              exit 1
            fi
            if [ -n "$(find "$out" -type f -print -quit)" ]; then
              echo "::error title=Wrote files::'dotnet new $* --project-name $name' was refused but left files behind."
              exit 1
            fi
          }
          for name in w _1; do
            refuse_name "$name"
            refuse_item "$name" cleanarch-presentation -n Portal --framework blazor-server
            refuse_item "$name" cleanarch-webapp -n Site --framework vite-react --scope sample
          done
          # The item template refuses as -n each name the template writes a project under.
          out="${{ runner.temp }}/refused-presentation"
          mkdir -p "$out"
          if (cd "$out" && dotnet new cleanarch-presentation -n Api --framework blazor-server --project-name Sample.Refused); then
            echo "::error title=Accepted::'dotnet new cleanarch-presentation -n Api' must be refused."
            exit 1
          fi
          if [ -n "$(find "$out" -type f -print -quit)" ]; then
            echo "::error title=Wrote files::'dotnet new cleanarch-presentation -n Api' was refused but left files behind."
            exit 1
          fi
          # An MCP server acts for the caller its credential names, and a project without accounts names nobody.
          out="${{ runner.temp }}/refused-mcp"
          mkdir -p "$out"
          if (cd "$out" && dotnet new cleanarch-presentation -n Mcp --framework mcp --project-name Sample.Refused --auth none --examples none --files false); then
            echo "::error title=Accepted::'dotnet new cleanarch-presentation --framework mcp --auth none' must be refused."
            exit 1
          fi
          if [ -n "$(find "$out" -type f -print -quit)" ]; then
            echo "::error title=Wrote files::'dotnet new cleanarch-presentation --framework mcp --auth none' was refused but left files behind."
            exit 1
          fi
          # A desktop client calls the API, which a project generated without it lacks.
          out="${{ runner.temp }}/refused-desktop-no-api"
          mkdir -p "$out"
          if (cd "$out" && dotnet new cleanarch-presentation -n Desktop --framework avalonia --project-name Sample.Refused --has-api false); then
            echo "::error title=Accepted::'dotnet new cleanarch-presentation --framework avalonia --has-api false' must be refused."
            exit 1
          fi
          if [ -n "$(find "$out" -type f -print -quit)" ]; then
            echo "::error title=Wrote files::'dotnet new cleanarch-presentation --framework avalonia --has-api false' was refused but left files behind."
            exit 1
          fi
          # A WebAssembly app calls the versioned routes a project without accounts does not publish.
          out="${{ runner.temp }}/refused-wasm-app"
          mkdir -p "$out"
          if (cd "$out" && dotnet new cleanarch-webapp -n WasmSite --framework blazor-wasm --project-name Sample.Refused --scope sample-refused --auth none); then
            echo "::error title=Accepted::'dotnet new cleanarch-webapp --framework blazor-wasm --auth none' must be refused."
            exit 1
          fi
          if [ -n "$(find "$out" -type f -print -quit)" ]; then
            echo "::error title=Wrote files::'dotnet new cleanarch-webapp --framework blazor-wasm --auth none' was refused but left files behind."
            exit 1
          fi
          out="${{ runner.temp }}/refused-ssr-app"
          mkdir -p "$out"
          if (cd "$out" && dotnet new cleanarch-webapp -n SsrSite --framework vite-vue --rendering ssr --scope sample-refused --auth none); then
            echo "::error title=Accepted::'dotnet new cleanarch-webapp --framework vite-vue --rendering ssr' must be refused."
            exit 1
          fi
          if [ -n "$(find "$out" -type f -print -quit)" ]; then
            echo "::error title=Wrote files::'dotnet new cleanarch-webapp --framework vite-vue --rendering ssr' was refused but left files behind."
            exit 1
          fi
