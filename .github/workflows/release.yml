name: Release

# Tag-driven: v1.2.3 publishes 1.2.3, 1.2, 1 and latest; a prerelease tag never moves latest.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CONFIGURATION: Release
  SOLUTION: AppTemplate.sln
  # GITHUB_TOKEN pushes here; for another registry change the login step, never widen permissions.
  REGISTRY: ghcr.io

jobs:
  # A tag does not skip the gate: every job below depends on this one.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION"

      #if (templateMaintenance)
      # Template repository only: it ships no migration, so each context's first one is created here, as bootstrap creates a project's.
      - name: Create the initial migrations
        run: |
          dotnet tool restore
          dotnet run Tools/Tasks.cs migration-initial

      #endif
      - name: Verify formatting
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Build
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore

      # No coverage at release time: the floor gates a change, and this tag already passed it.
      - name: Test
        run: |
          #if (templateMaintenance)
          # This repository's own floor, as in ci.yml; a generated project carries none.
          minimum_tests=3000
          floor_option="--minimum-expected-tests ${minimum_tests}"
          #endif
          dotnet test "$SOLUTION" \
            --configuration "$CONFIGURATION" \
            --no-build \
            ${floor_option}

      - name: Audit dependencies
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error title=Vulnerable packages::Refusing to release with a known advisory."
            exit 1
          fi

  # What a deployment runs against the database, built from the same commit as the image.
  migration-bundle:
    name: Migration bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Self-contained bundles with no connection string: run ./efbundle --connection as a principal with DDL rights, not the application's user.
      - name: Install dotnet-ef
        run: dotnet tool restore

      # dotnet ef reads each project's restored assets before it builds anything.
      - name: Restore
        run: dotnet restore "$SOLUTION"

      #if (templateMaintenance)
      # Template repository only: the bundles carry the migrations created here, as bootstrap creates a project's.
      - name: Create the initial migrations
        run: dotnet run Tools/Tasks.cs migration-initial

      #endif
      #if (localAuth)
      # One bundle per context: a release without this one leaves the identity schema absent.
      - name: Build the identity bundle
        run: |
          dotnet ef migrations bundle \
            --project Src/Infrastructure/AppTemplate.Infrastructure.Auth \
            --startup-project Src/Infrastructure/AppTemplate.Infrastructure.Auth \
            --configuration "$CONFIGURATION" \
            --self-contained \
            --target-runtime linux-x64 \
            --force \
            --output efbundle-identity

      #endif
      - name: Build the business bundle
        run: |
          dotnet ef migrations bundle \
            --project Src/Infrastructure/AppTemplate.Infrastructure.Persistence \
            --startup-project Src/Infrastructure/AppTemplate.Infrastructure.Persistence \
            --configuration "$CONFIGURATION" \
            --self-contained \
            --target-runtime linux-x64 \
            --force \
            --output efbundle

      - name: Assert both bundles exist and are executable
        run: |
          #if (localAuth)
          for bundle in efbundle-identity efbundle; do
          #else
          for bundle in efbundle; do
          #endif
            test -x "$bundle" || {
              echo "::error title=No bundle::$bundle was not produced."
              exit 1
            }
          done
          #if (localAuth)
          ls -l efbundle-identity efbundle
          #else
          ls -l efbundle
          #endif

      - name: Upload bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migration-bundle-${{ inputs.tag || github.ref_name }}
          path: |
            #if (localAuth)
            efbundle-identity
            #endif
            efbundle
          if-no-files-found: error
          retention-days: 90

  image:
    name: Container image (${{ matrix.component }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    #if (jobsWorker)
    # Two images from one commit: the API, and the worker that runs the periodic jobs.
    #else
    # One image, the API, which also runs the periodic jobs.
    #endif
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: Src/Presentation/AppTemplate.Api/Dockerfile
          #if (jobsWorker)
          - component: worker
            dockerfile: Src/Presentation/AppTemplate.Worker/Dockerfile
          #endif
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing material for the attestation
      attestations: write    # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The binfmt image, pinned by digest; Dependabot does not read a with: input, so bump it by hand.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      # The BuildKit image, pinned by digest and bumped by hand like the binfmt image.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase, as the registry requires.
      - name: Compute image name
        id: name
        run: echo "image=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The SBOM scanner image, pinned and bumped by hand like the two above.
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed provenance, verifiable with gh attestation verify.
      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Verify:"
            echo '```'
            echo "gh attestation verify oci://${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
