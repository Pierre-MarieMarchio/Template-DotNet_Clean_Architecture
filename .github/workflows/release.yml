name: Release

# Tag-driven. `v1.2.3` publishes 1.2.3, 1.2, 1 and latest; `v1.2.3-rc.1` publishes only the
# full prerelease tag and never moves `latest`.
#
# No secret to create: GITHUB_TOKEN authenticates against GHCR for the repository that owns the
# workflow. If you push somewhere else, add a registry credential and change the `login` step —
# do not widen `permissions` to compensate.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.2.3"
        required: true
        type: string

# Nothing here may write to the repository contents. Each job asks for exactly what it needs and
# no job inherits another's grant.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CONFIGURATION: Release
  SOLUTION: AppTemplate.sln
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # A tag is not a licence to skip the gate. Everything below depends on this.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Verify formatting
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Build
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore

      # Architecture rules run without the coverage collector, for the reason
      # documented in ci.yml. Here the whole solution runs plainly — no coverage
      # is collected at release time, so the split is unnecessary.
      - name: Test
        run: dotnet test "$SOLUTION" --configuration "$CONFIGURATION" --no-build

      - name: Audit dependencies
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error title=Vulnerable packages::Refusing to release with a known advisory."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The migration bundle. This is what a deployment runs against the database;
  # the API applies migrations at startup in Development only (docs/adr/0009).
  #
  # Built here rather than in a deploy job so that the artifact is produced from
  # the same commit as the image, and so applying migrations never needs the SDK
  # or the source tree on the target.
  migration-bundle:
    name: Migration bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool restore

      # --self-contained so the target needs no .NET runtime at all: the bundle is
      # the single thing you copy to run pending migrations.
      #
      # The bundle embeds no connection string. Supply one at run time:
      #   ./efbundle --connection "$CONNECTION_STRING"
      # Use a migration-time principal with DDL rights, NOT the application's
      # runtime user — the app should not be able to alter its own schema.
      - name: Build bundle
        run: |
          dotnet ef migrations bundle \
            --project Src/Infrastructure/AppTemplate.Infrastructure.Persistence \
            --startup-project Src/Infrastructure/AppTemplate.Infrastructure.Persistence \
            --configuration "$CONFIGURATION" \
            --self-contained \
            --target-runtime linux-x64 \
            --force \
            --output efbundle

      - name: Assert the bundle exists and is executable
        run: |
          test -x efbundle || { echo "::error title=No bundle::efbundle was not produced."; exit 1; }
          ls -l efbundle

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-bundle-${{ inputs.tag || github.ref_name }}
          path: efbundle
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing material for the attestation
      attestations: write    # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name must be lowercase; a repository with capitals in its name
      # would otherwise fail at push with an unhelpful error.
      - name: Compute image name
        id: name
        run: echo "image=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/api" >> "$GITHUB_OUTPUT"

      # `latest` is attached only for a stable semver tag: the enable expression
      # excludes anything with a prerelease suffix, so an rc never becomes latest.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(inputs.tag || github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Src/Presentation/AppTemplate.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM and a provenance record travel with the image rather than in a
          # separate artifact nobody correlates afterwards.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed provenance linking the digest to this workflow run and commit.
      # `docker/build-push-action` records provenance inside the image; this makes it
      # independently verifiable with `gh attestation verify`.
      - name: Attest provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Verify:"
            echo '```'
            echo "gh attestation verify oci://${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
