# Local stack: cp .env.example .env, then docker compose up --build; every value comes from .env.

name: app-template

#if (anyWeb)
# One line per web app: its compose.yml declares the service, built from Src/Web.
include:
  #if (webPlaceholder)
  - path: Src/Web/apps/PlaceholderSite/compose.yml
  #endif
  #if (webReact)
  - path: Src/Web/apps/ReactSite/compose.yml
  #endif
  #if (webAngular)
  - path: Src/Web/apps/AngularSite/compose.yml
  #endif

#endif
services:
  db:
    # Every image is pinned by tag and digest; Dependabot bumps both.
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Loopback only, for a client on this machine; remove it for any non-local use.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql: a mount of /var/lib/postgresql/data loses it on down.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [backend]

  mailpit:
    # The mail catcher: account mails land at http://localhost:8025.
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP on loopback as well, for the API run on the host with dotnet run.
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks: [backend]

  api:
    image: app-template-api:dev
    build:
      context: .
      dockerfile: Src/Presentation/AppTemplate.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"

      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true;Gss Encryption Mode=Disable"

      # Keep replicas x pool size under PostgreSQL's max_connections: docs/CONFIGURATION.md.
      Database__MaxPoolSize: ${DATABASE_MAX_POOL_SIZE:-20}
      Database__CommandTimeoutSeconds: ${DATABASE_COMMAND_TIMEOUT_SECONDS:-30}

      IdempotencyPurge__BatchSize: ${IDEMPOTENCY_PURGE_BATCH_SIZE:-1000}

      # false on an instance that only serves HTTP; with several instances, true on exactly one.
      Jobs__Enabled: ${JOBS_ENABLED:-true}

      Jobs__Maintenance__Interval: ${JOBS_MAINTENANCE_INTERVAL:-01:00:00}
      Jobs__Maintenance__PurgeExpiredIdempotencyKeysEnabled: ${JOBS_MAINTENANCE_PURGE_IDEMPOTENCY_KEYS:-true}
      #if (localAuth)
      Jobs__Maintenance__PurgeExpiredRefreshTokensEnabled: ${JOBS_MAINTENANCE_PURGE_REFRESH_TOKENS:-true}
      #endif

      #if (reminders)
      Jobs__Reminders__Interval: ${JOBS_REMINDERS_INTERVAL:-00:01:00}
      Jobs__Reminders__Enabled: ${JOBS_REMINDERS_ENABLED:-true}
      #endif

      #if (files)
      # Inspection off stops the Files feature, and reclaim off leaks storage: docs/CONFIGURATION.md.
      Jobs__Files__InspectDepositedFilesInterval: ${JOBS_FILES_INSPECT_INTERVAL:-00:01:00}
      Jobs__Files__InspectDepositedFilesEnabled: ${JOBS_FILES_INSPECT_ENABLED:-true}
      Jobs__Files__PurgeAbandonedRegistrationsInterval: ${JOBS_FILES_PURGE_INTERVAL:-01:00:00}
      Jobs__Files__PurgeAbandonedRegistrationsEnabled: ${JOBS_FILES_PURGE_ENABLED:-true}
      Jobs__Files__ReclaimOrphanedContentInterval: ${JOBS_FILES_RECLAIM_INTERVAL:-12:00:00}
      Jobs__Files__ReclaimOrphanedContentEnabled: ${JOBS_FILES_RECLAIM_ENABLED:-true}

      #endif
      Localization__DefaultCulture: ${LOCALIZATION_DEFAULT_CULTURE:-en}

      #if (localAuth)
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (min 32 bytes; openssl rand -base64 48)}
      Jwt__Issuer: ${JWT_ISSUER:?set JWT_ISSUER in .env}
      Jwt__Audience: ${JWT_AUDIENCE:?set JWT_AUDIENCE in .env}
      Jwt__RequireHttpsMetadata: ${JWT_REQUIRE_HTTPS_METADATA:-false}
      Jwt__AccessTokenLifetimeInMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}

      RefreshToken__LifetimeInDays: ${REFRESH_TOKEN_LIFETIME_DAYS:-7}

      Identity__PasswordRequiredLength: ${IDENTITY_PASSWORD_LENGTH:-8}
      Identity__PasswordRequiredUniqueChars: ${IDENTITY_PASSWORD_UNIQUE_CHARS:-1}
      Identity__PasswordRequireDigit: ${IDENTITY_PASSWORD_REQUIRE_DIGIT:-false}
      Identity__PasswordRequireLowercase: ${IDENTITY_PASSWORD_REQUIRE_LOWERCASE:-false}
      Identity__PasswordRequireUppercase: ${IDENTITY_PASSWORD_REQUIRE_UPPERCASE:-false}
      Identity__PasswordRequireNonAlphanumeric: ${IDENTITY_PASSWORD_REQUIRE_NONALPHANUMERIC:-false}
      Identity__LockoutEnabled: ${IDENTITY_LOCKOUT_ENABLED:-true}
      Identity__LockoutMaxFailedAccessAttempts: ${IDENTITY_LOCKOUT_MAX_ATTEMPTS:-10}
      Identity__LockoutDurationInMinutes: ${IDENTITY_LOCKOUT_DURATION_MINUTES:-1}
      Identity__RequireConfirmedEmail: ${IDENTITY_REQUIRE_CONFIRMED_EMAIL:-true}
      Identity__RequireUniqueEmail: ${IDENTITY_REQUIRE_UNIQUE_EMAIL:-true}
      #endif
      #if (externalAuth)
      Authentication__External__Authority: ${EXTERNAL_AUTH_AUTHORITY:-}
      Authentication__External__Audience: ${EXTERNAL_AUTH_AUDIENCE:-}
      Authentication__External__RequireHttpsMetadata: ${EXTERNAL_AUTH_REQUIRE_HTTPS_METADATA:-true}
      Authentication__External__Roles__Source: ${EXTERNAL_AUTH_ROLES_SOURCE:-Local}
      Authentication__External__Roles__ClaimPath: ${EXTERNAL_AUTH_ROLES_CLAIM_PATH:-}
      Authentication__External__Roles__AdministratorRole: ${EXTERNAL_AUTH_ADMINISTRATOR_ROLE:-Admin}
      #endif

      #if (files)
      Files__Storage__S3__BucketName: ${STORAGE_BUCKET_NAME:-app-files}
      Files__Storage__S3__Endpoint: ${STORAGE_ENDPOINT:-http://objectstore:9000}
      # The name a browser resolves, signed into every presigned URL.
      Files__Storage__S3__PublicEndpoint: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      Files__Storage__S3__ForcePathStyle: ${STORAGE_FORCE_PATH_STYLE:-true}
      Files__Storage__S3__AllowInsecureTransport: ${STORAGE_ALLOW_INSECURE_TRANSPORT:-true}
      Files__Storage__S3__AccessKeyId: ${STORAGE_ACCESS_KEY_ID:-app-template-dev}
      Files__Storage__S3__SecretAccessKey: ${STORAGE_SECRET_ACCESS_KEY:-app-template-dev-secret}
      #endif
      Email__Host: ${EMAIL_HOST:-mailpit}
      Email__Port: ${EMAIL_PORT:-1025}
      # mailpit speaks no TLS: None with the explicit opt-in; a real relay takes StartTls or SslOnConnect.
      Email__Security: ${EMAIL_SECURITY:-None}
      Email__AllowInsecureTransport: ${EMAIL_ALLOW_INSECURE_TRANSPORT:-true}
      Email__UserName: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@localhost}
      Email__FromName: ${EMAIL_FROM_NAME:-AppTemplate (dev)}

      #if (localAuth)
      EmailConfirmation__ConfirmEmailUrl: ${CONFIRM_EMAIL_URL:-http://localhost:${WEB_PLACEHOLDER_SITE_HOST_PORT:-8081}/confirm-email}

      PasswordReset__ResetPasswordUrl: ${RESET_PASSWORD_URL:-http://localhost:${WEB_PLACEHOLDER_SITE_HOST_PORT:-8081}/reset-password}

      EmailChange__ConfirmEmailChangeUrl: ${CONFIRM_EMAIL_CHANGE_URL:-http://localhost:${WEB_PLACEHOLDER_SITE_HOST_PORT:-8081}/confirm-email-change}

      # Development only; enabling it requires SEED_ADMIN_PASSWORD.
      IdentitySeed__Enabled: ${SEED_ENABLED:-false}
      IdentitySeed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      IdentitySeed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      #endif

      # Arrays bind by index with the __N suffix.
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:4200}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      #if (files)
      objectstore:
        condition: service_healthy
      #endif
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks: [backend]

  #if (files)
  objectstore:
    # SeaweedFS stands in for S3 locally; in production point Files__Storage__S3__Endpoint at your provider.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: >
      mini -dir=/data -s3.port=9000 -bucket=${STORAGE_BUCKET_NAME:-app-files}
      -s3.autoCreateBucket=false -master.telemetry=false
      -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    restart: unless-stopped
    environment:
      # The one S3 identity, whose existence also refuses anonymous access.
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-app-template-dev}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-app-template-dev-secret}
    ports:
      - "127.0.0.1:${OBJECT_STORE_HOST_PORT:-9000}:9000"
    volumes:
      - objectstore-data:/data
    healthcheck:
      # Healthy once the gateway serves and the bucket exists, which the api service waits on.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/healthz && wget -q -O /dev/null http://127.0.0.1:8888/buckets/${STORAGE_BUCKET_NAME:-app-files}/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]

  #endif
  #if (sonar)

  sonarqube:
    profiles: [sonar]
    # Started only with the sonar profile: docker compose --profile sonar up -d --wait sonarqube
    image: sonarqube:26.9.0.129388-community@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      # Neither 9000, the object store's, nor 9100, reserved for printing on Windows.
      - "127.0.0.1:9111:9000"   # the web UI — http://localhost:9111, admin/admin on first boot
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    healthcheck:
      # Reads the status, because the endpoint answers 200 while still STARTING.
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks: [backend]

  # The one-shot analysis that dotnet run Tools/Tasks.cs sonar drives.
  sonar-scanner:
    profiles: [sonar]
    build:
      context: .
      dockerfile: Tools/sonar-scanner.Dockerfile
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      # Empty by default, because Compose interpolates every profile; the scan script checks it.
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY:-app-template}
    volumes:
      - .:/repo
    networks: [backend]

  #endif
volumes:
  db-data:
  #if (files)
  objectstore-data:
  #endif
  #if (sonar)
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
  #endif

networks:
  # Declared, so that no other stack on this host shares it.
  backend:
    driver: bridge
