name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push cancels the previous one, except on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege; a job that needs more opts in locally.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # Inside the workspace, so actions/cache sees it.
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release
  SOLUTION: AppTemplate.sln

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Report toolchain
        run: dotnet --info

      - name: Restore
        run: dotnet restore "$SOLUTION"

      #if (templateMaintenance)
      # Template repository only: it ships no migration, so each context's first one is created here, as bootstrap creates a project's.
      - name: Create the initial migrations
        run: |
          dotnet tool restore
          dotnet run Tools/Tasks.cs migration-initial

      #endif
      # Whitespace, using order and the BOM, which the build's code-style analysis does not check; before the build, to fail fast.
      - name: Verify formatting (.editorconfig)
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore --verbosity normal

      # TreatWarningsAsErrors lives in Directory.Build.props, and no flag here overrides it.
      - name: Build
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore

      # The platform runs only the test modules the solution names, so a project missing from it would be skipped silently.
      - name: Assert test projects exist and are in the solution
        run: |
          set -euo pipefail
          mapfile -t projects < <(find Tests -name '*.csproj' 2>/dev/null | sort)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error title=No tests::No *.csproj found under Tests/. The test suite is mandatory."
            exit 1
          fi
          echo "Found ${#projects[@]} test project(s):"
          solution_paths=$(tr '\\' '/' < "$SOLUTION")
          missing=0
          for p in "${projects[@]}"; do
            # A here-string, not a pipe: grep -q closing the pipe early fails the pipeline under pipefail.
            if grep -qF -- "$p" <<< "$solution_paths"; then
              echo "  in solution : $p"
            else
              echo "  MISSING     : $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error title=Test project not in solution::A project under Tests/ is missing from $SOLUTION, so \`dotnet test\` would skip it silently."
            exit 1
          fi

      # Microsoft.Testing.Platform switches: the settings file goes through coverage-settings; the VSTest settings switch is accepted and ignored.
      - name: Test (with coverage)
        run: |
          #if (templateMaintenance)
          # This repository's own floor, below its real total; a generated project carries none.
          minimum_tests=3000
          floor_option="--minimum-expected-tests ${minimum_tests}"
          #endif
          dotnet test \
            --solution "$SOLUTION" \
            --configuration "$CONFIGURATION" \
            --no-build \
            --results-directory TestResults \
            --report-xunit-trx \
            --coverage \
            --coverage-settings coverage.runsettings \
            --coverage-output-format cobertura \
            ${floor_option}

      # The totals read from the TRX files; a run that produced none fails.
      - name: Summarise test results
        if: always()
        run: |
          dotnet run Tools/TestSummary.cs \
            --root TestResults \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage floor
        if: always()
        run: |
          set -euo pipefail
          # The first line that is a number: a BOM in front of a leading # defeats a comment filter.
          minimum=$(tr -d '\r' < coverage.minimum | grep -oE '^[0-9]+(\.[0-9]+)?$' | head -n 1)
          if [ -z "$minimum" ]; then
            echo "::error title=No coverage floor::coverage.minimum states no bare number."
            exit 1
          fi
          echo "Coverage floor from coverage.minimum: ${minimum}%"
          dotnet run Tools/CoverageGate.cs \
            --root TestResults \
            --minimum "$minimum" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json TestResults/coverage-summary.json

      # The extension, as Tools/CoverageGate.cs matches it; if-no-files-found cannot see one pattern that matches nothing.
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/*.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  #if (templateMaintenance)
  # Template repository only: each gate proves it can fail before it judges the tree.
  repository-hygiene:
    name: Docs and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The doc-path gate can fail
        run: dotnet run Tools/CheckDocPaths.cs --self-test

      - name: Every path cited in the docs exists
        run: dotnet run Tools/CheckDocPaths.cs .

      - name: The workflow gate can fail
        run: dotnet run Tools/CheckWorkflows.cs --self-test

      - name: Workflows are structurally sound
        run: dotnet run Tools/CheckWorkflows.cs .

      - name: The coverage gate can fail
        run: dotnet run Tools/CoverageGate.cs --self-test

      - name: The comment gate can fail
        run: dotnet run Tools/CheckComments.cs --self-test

      - name: No comment outside the allowlist
        run: dotnet run Tools/CheckComments.cs .

  # Template repository only: dnx CleanArch.Create, tested against this checkout's templates, generation included.
  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Launcher/CleanArch.Create.slnx

      - name: Formatting
        run: dotnet format Launcher/CleanArch.Create.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Launcher/CleanArch.Create.slnx --configuration "$CONFIGURATION" --no-restore

      - name: Test
        run: dotnet test --solution Launcher/CleanArch.Create.slnx --configuration "$CONFIGURATION" --no-build
  #else
  # The gates the tree carries, each after its own self-test, as verify runs them first.
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Every carried gate, after its self-test
        run: dotnet run Tools/Tasks.cs hygiene
  #endif

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION"

      # The listing exits 0 on a finding, so its report is read; answer with a pin in Directory.Packages.props, never by relaxing NuGetAuditLevel.
      - name: Audit direct and transitive dependencies
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error title=Vulnerable packages::A referenced package has a known advisory. Bump the pin in Directory.Packages.props."
            exit 1
          fi
          echo "No known vulnerable packages."

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The BuildKit image, pinned by digest; Dependabot does not read a with: input, so bump it by hand.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      # Catches a stale COPY list in the Dockerfile; one platform, never pushed.
      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Src/Presentation/AppTemplate.Api/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: app-template-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert image runs unprivileged
        run: |
          user=$(docker image inspect "app-template-api:ci-${{ github.sha }}" --format '{{.Config.User}}')
          echo "Image USER = '${user}'"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error title=Image runs as root::Expected a non-root USER (APP_UID)."
            exit 1
          fi

      - name: Assert only 8080 is exposed
        run: |
          ports=$(docker image inspect "app-template-api:ci-${{ github.sha }}" --format '{{range $p, $_ := .Config.ExposedPorts}}{{$p}} {{end}}')
          echo "Exposed = '${ports}'"
          if [ "$(echo $ports | tr -d ' ')" != "8080/tcp" ]; then
            echo "::error title=Unexpected exposed ports::TLS terminates upstream; the container must expose 8080/tcp only."
            exit 1
          fi

  # Non-blocking: a hosted runner's timings say nothing about this code, and the thresholds describe a broken system.
  load:
    name: Load smoke (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      #if (templateMaintenance)
      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Template repository only: it ships no migration, so each context's first one is created here, as bootstrap creates a project's.
      - name: Create the initial migrations
        run: |
          dotnet tool restore
          dotnet run Tools/Tasks.cs migration-initial

      #endif
      - name: Start the stack
        run: |
          cp .env.example .env
          services="api db mailpit"
          #if (files)
          services="$services objectstore"
          #endif
          docker compose up -d --build $services

      # Migrations run at startup, so a running container is not yet an answering API.
      - name: Wait for the API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "API answered on attempt $attempt."
              exit 0
            fi
            sleep 2
          done
          echo "::warning title=Load smoke::The API never became live; skipping the run."
          docker compose logs --tail 50 api
          exit 1

      # The release archive checked against its published SHA-256: bump version and checksum together.
      - name: Install k6
        run: |
          set -euo pipefail
          version=v2.2.0
          sha256=b5a8003c86f35f5cd5ceef1490312c48e587696c94d998cefc6d7b3b4cb1597d
          archive="k6-${version}-linux-amd64"
          curl -sSfL --retry 3 --retry-delay 2 \
            -o /tmp/k6.tar.gz \
            "https://github.com/grafana/k6/releases/download/${version}/${archive}.tar.gz"
          echo "${sha256}  /tmp/k6.tar.gz" | sha256sum --check --strict -
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/${archive}/k6" /usr/local/bin/k6
          k6 version

      - name: Smoke
        run: k6 run -e BASE_URL=http://localhost:8080 Tests/Load/smoke.js

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Blocking: the stack as shipped, built and started from .env.example; the task prints the stack's logs on a failure.
  end-to-end:
    name: End-to-end
    needs: compose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Start the stack, run the suite, remove the stack
        #if (templateMaintenance)
        if: hashFiles('.template.config/template.json') == ''
        #endif
        run: dotnet run Tools/Tasks.cs end-to-end

  compose:
    name: Compose manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate docker-compose.yml against .env.example
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker compose config parsed successfully."

      # Liveness only: a probe on /health/ready would restart the API whenever the database blinked.
      - name: Assert healthchecks target /health
        run: |
          set -euo pipefail
          cp .env.example .env
          compose_probe=$(docker compose config | grep -c 'http://127.0.0.1:8080/health ' || true)
          if [ "$compose_probe" -eq 0 ]; then
            echo "::error title=Compose healthcheck::The api service healthcheck must probe /health (liveness), not /health/ready."
            exit 1
          fi
          if ! grep -q 'http://127.0.0.1:8080/health ' Src/Presentation/AppTemplate.Api/Dockerfile; then
            echo "::error title=Dockerfile HEALTHCHECK::The image HEALTHCHECK must probe /health (liveness), not /health/ready."
            exit 1
          fi
          echo "Both healthchecks target /health."
