name: Template acceptance

# Template repository only: each leg installs the template package packed from this checkout, generates under another name and gates what an adopter would get.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One run per ref: a new push cancels the previous one, except on main.
concurrency:
  group: template-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege; nothing here writes to the repository.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  # Packed once; every leg installs this .nupkg, so what is proved is what a user installs.
  pack:
    name: Pack the template package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: dotnet pack .template.config/TemplatePackage.csproj --configuration Release --output "${{ runner.temp }}/package"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-package
          path: ${{ runner.temp }}/package/*.nupkg
          if-no-files-found: error
          retention-days: 3

  # The legs are the shapes the options produce, not their cross product; auth_context says whether the Auth DbContext exists.
  template:
    name: Template acceptance (${{ matrix.name }})
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes || 45 }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            options: ""
            auth_context: "true"
            integration: "true"
            generator: "true"
            end_to_end: "true"
          - name: auth none, smallest project
            options: --auth none --examples none --files false --agent-files false
            auth_context: "false"
            integration: "true"
          - name: external auth, notes
            options: --auth external --examples notes
            auth_context: "false"
          - name: local auth, no files, no ci, no sonar
            options: --auth local --examples none --files false --ci false --sonar false
            auth_context: "true"
            generator: "true"
          - name: external auth, all examples
            options: --auth external --examples all --files true
            auth_context: "false"
          # The SQL Server image is linux/amd64 only and about 1.6 GB: one leg, with a longer timeout.
          - name: sql server, external auth, all examples
            options: --database sqlserver --auth external --examples all --files true
            database: sqlserver
            auth_context: "false"
            integration: "true"
            end_to_end: "true"
            timeout_minutes: 60
          - name: external auth, no examples, no files
            options: --auth external --examples none --files false
            auth_context: "false"
            generator: "true"
          - name: web placeholder, smallest project
            options: --web placeholder --auth none --examples none --files false
            auth_context: "false"
            web: "true"
          - name: web react, local auth
            options: --web react
            auth_context: "true"
            web: "true"
          # No provider runs in Compose: the API needs one named to start, and fetches nothing from it until a token arrives.
          - name: web angular, external auth, notes
            options: --web angular --auth external --examples notes
            auth_context: "false"
            web: "true"
            stack_env: "EXTERNAL_AUTH_AUTHORITY=https://identity-provider.invalid/\nEXTERNAL_AUTH_AUDIENCE=acceptance"
          - name: web react back office, smallest local project
            options: --web react --web-audience admin --examples none --files false
            auth_context: "true"
            web: "true"
          - name: web react, then an angular back office
            options: --web react
            auth_context: "true"
            web: "true"
            second_app: --framework angular --audience admin --scope sample-generated-project
          - name: no web, then a react app and its workspace
            options: ""
            auth_context: "true"
            web: "true"
            first_app: --framework react --scope sample-generated-project --workspace
          # Every framework starter in one workspace: the project's own app, then each other starter beside it, on a port of its own.
          - name: web, every starter
            options: --web vue --examples none --files false
            auth_context: "true"
            web: "true"
            more_apps: ViteReactSite:8083:vite-react ViteVueSite:8084:vite-vue ViteSvelteSite:8085:vite-svelte AngularSite:8086:angular ReactRouterSite:8087:react-router
          - name: sqlite, defaults
            options: --database sqlite
            database: sqlite
            auth_context: "true"
            integration: "true"
            end_to_end: "true"
          - name: sqlite, smallest project
            options: --database sqlite --auth none --examples none --files false
            database: sqlite
            auth_context: "false"
            integration: "true"
          - name: sqlite, external auth, all examples
            options: --database sqlite --auth external --examples all --files true
            database: sqlite
            auth_context: "false"
            integration: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the template package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: template-package
          path: ${{ runner.temp }}/package

      - name: Install the template package
        run: dotnet new install "${{ runner.temp }}"/package/*.nupkg

      # A name unlike AppTemplate's in shape and length; the options stay unquoted, being several arguments from the matrix.
      - name: Generate a project under a different name
        env:
          OPTIONS: ${{ matrix.options }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dotnet new cleanarch-webapi -n Sample.Generated.Project -o "${{ runner.temp }}/generated" $OPTIONS

      - name: Assert the template's own name leaked nowhere
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          content=$(grep -rIil --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj -e 'AppTemplate' -e 'app-template' . || true)
          paths=$(find . \( -name .git -o -name bin -o -name obj \) -prune -o \( -iname '*AppTemplate*' -o -iname '*app-template*' \) -print)
          if [ -n "$content$paths" ]; then
            echo "::error title=Template name leaked::The generated project still names the template."
            printf '%s\n' "$content" "$paths"
            exit 1
          fi

      # A project carries one database provider: no other provider's package, type or SQL reaches its code, tests or tooling.
      - name: Assert no other database provider leaked into the project
        working-directory: ${{ runner.temp }}/generated
        env:
          DATABASE: ${{ matrix.database || 'postgresql' }}
        run: |
          set -euo pipefail
          case "$DATABASE" in
            postgresql) forbidden='SqlServer|SqlClient|MsSql|MySql|Pomelo|VersionStamping|SchemaAsTablePrefix|database-(sqlserver|mysql|sqlite)' ;;
            sqlserver) forbidden='Npgsql|PostgreSql|xmin|pg_|MySql|Pomelo|SchemaAsTablePrefix' ;;
            mysql) forbidden='Npgsql|PostgreSql|xmin|pg_|SqlServer|SqlClient|MsSql' ;;
            sqlite) forbidden='Npgsql|PostgreSql|xmin|pg_|SqlServer|SqlClient|MsSql|MySql|Pomelo' ;;
            *) echo "::error title=Unknown database::$DATABASE"; exit 1 ;;
          esac
          leaked=$(grep -rIlE "$forbidden" --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj --exclude-dir=node_modules --exclude-dir=docs . || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Database provider leaked::A --database $DATABASE project names another provider."
            grep -rInE "$forbidden" $leaked | head -50
            exit 1
          fi

      # The API is ready for a web app in every project; the workspace, its workflow, its Dependabot entry and its Compose wiring come with the first app only.
      - name: Assert a project without a web app carries no web workspace
        if: matrix.web != 'true' || matrix.first_app
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          problems=()
          [ ! -e Src/Web ] || problems+=("Src/Web exists.")
          [ ! -e .github/workflows/web.yml ] || problems+=(".github/workflows/web.yml exists.")
          workflows=$(grep -rIl -e 'pnpm' -e 'Src/Web' -e 'web-' .github/workflows || true)
          [ -z "$workflows" ] || problems+=("A workflow runs pnpm or a web job: $workflows")
          ! grep -qE '^include:|^  web-|Src/Web' docker-compose.yml || problems+=("docker-compose.yml includes or declares a web service.")
          ! grep -qE 'package-ecosystem: npm|Src/Web' .github/dependabot.yml || problems+=(".github/dependabot.yml watches the web workspace.")
          ! grep -qE '^WEB_[A-Z0-9_]+_HOST_PORT=' .env.example || problems+=(".env.example names a web app's port.")
          ignored=$(grep -l 'Src/Web' .dockerignore .gitignore || true)
          [ -z "$ignored" ] || problems+=("An ignore file names Src/Web: $ignored")
          if [ "${#problems[@]}" -gt 0 ]; then
            echo "::error title=Web trace::A project generated without --web holds or wires a web workspace."
            printf '%s\n' "${problems[@]}"
            exit 1
          fi

      # A project generated without a web app takes its first one, and the workspace around it, from the item template; the include block and the port are the lines Src/Web/README.md gives.
      - name: Add the first app with cleanarch-webapp --workspace
        if: matrix.first_app
        working-directory: ${{ runner.temp }}/generated
        env:
          FIRST_APP: ${{ matrix.first_app }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dotnet new cleanarch-webapp -n Site $FIRST_APP
          leaked=$(grep -rIl -e AppTemplate -e app-template -e PlaceholderSite -e placeholder-site -e FrameworkSite -e framework-site Src/Web .github docs || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Item template token leaked::$leaked"
            exit 1
          fi
          sed -i 's#^services:$#include:\n  - path: Src/Web/apps/Site/compose.yml\n\nservices:#' docker-compose.yml
          printf 'WEB_SITE_HOST_PORT=5173\n' >> .env.example
          grep -A3 '^include:' docker-compose.yml

      # ASP.NET Core tolerates the trailing comma a condition can leave; a strict parser does not.
      - name: Assert every generated JSON file is strict JSON
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! python3 -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8-sig"))' "$file" 2>"${{ runner.temp }}/json-error"; then
              echo "::error file=$file,title=Not strict JSON::$(cat "${{ runner.temp }}/json-error")"
              status=1
            fi
          done < <(find . \( -name .git -o -name bin -o -name obj -o -name node_modules \) -prune -o -name '*.json' -print0)
          exit "$status"

      # Using order depends on the generated name, so one bootstrap run must be enough: docs/getting-started/first-run.md.
      - name: Bootstrap formatting, then verify it is stable
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet format Sample.Generated.Project.sln
          dotnet format Sample.Generated.Project.sln --verify-no-changes --verbosity normal

      # The project ships no migration: bootstrap's migration-initial creates each context's first one, which every later step reads, and a second run creates none.
      - name: Bootstrap the initial migrations
        working-directory: ${{ runner.temp }}/generated
        env:
          AUTH_CONTEXT: ${{ matrix.auth_context }}
        run: |
          set -euo pipefail
          if [ -n "$(find Src/Infrastructure -path '*/Migrations/*' -name '*.cs')" ]; then
            echo "::error title=Migrations shipped::The generated project carries a migration; bootstrap creates the first one."
            exit 1
          fi
          dotnet run Tools/Tasks.cs migration-initial
          contexts=(Persistence)
          if [ "$AUTH_CONTEXT" = "true" ]; then
            contexts+=(Auth)
          fi
          for context in "${contexts[@]}"; do
            snapshots=$(find Src/Infrastructure -path "*.Infrastructure.$context/Migrations/*ModelSnapshot.cs" | wc -l)
            [ "$snapshots" -eq 1 ] || { echo "::error title=No initial migration::$context has $snapshots model snapshots."; exit 1; }
          done
          created=$(find Src/Infrastructure -path '*/Migrations/*' -name '*.cs' | sort)
          dotnet run Tools/Tasks.cs migration-initial
          if [ "$(find Src/Infrastructure -path '*/Migrations/*' -name '*.cs' | sort)" != "$created" ]; then
            echo "::error title=Not idempotent::A second migration-initial changed the migrations."
            exit 1
          fi

      - name: Restore and build the generated project
        working-directory: ${{ runner.temp }}/generated
        run: |
          dotnet restore Sample.Generated.Project.sln
          dotnet build Sample.Generated.Project.sln --configuration Release --no-restore

      # The reviewed OpenAPI reference the integration suite compares against, written as bootstrap writes it.
      - name: Write the OpenAPI reference (integration legs)
        if: matrix.integration == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: dotnet run Tools/Tasks.cs openapi

      # Selected by the csproj, not by a name pattern: IsTestProject set and no Testcontainers reference, which leaves the end-to-end suite out.
      - name: Run the Docker-free tests
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          mapfile -t projects < <(grep -rl --include='*.csproj' '<IsTestProject>true</IsTestProject>' Tests | xargs -r grep -L 'Testcontainers' | sort)
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error title=No test projects::Discovery found nothing to run in the generated project."
            exit 1
          fi
          for project in "${projects[@]}"; do
            echo "::group::$project"
            dotnet test "$project" --configuration Release --no-build --output Detailed
            echo "::endgroup::"
          done

      # The projects the Docker-free step leaves out, against the runner's Docker: the HTTP surface the options change most.
      - name: Run the integration tests (Testcontainers)
        if: matrix.integration == 'true'
        working-directory: ${{ runner.temp }}/generated
        env:
          DATABASE: ${{ matrix.database || 'postgresql' }}
        run: |
          set -euo pipefail
          mapfile -t projects < <(grep -r --include='*.csproj' -l 'Testcontainers' Tests | sort)
          # A SQLite project without files starts no container: its integration suites ran with the Docker-free tests.
          if [ "${#projects[@]}" -eq 0 ] && [ "$DATABASE" = "sqlite" ]; then
            exit 0
          fi
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "::error title=No integration projects::No test project of the generated project references Testcontainers."
            exit 1
          fi
          for project in "${projects[@]}"; do
            echo "::group::$project"
            dotnet test "$project" --configuration Release --no-build --output Detailed
            echo "::endgroup::"
          done

      # The generated project's own task: its Compose stack from .env.example, the suite, then the stack removed.
      - name: Run the end-to-end suite (end-to-end legs)
        if: matrix.end_to_end == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: dotnet run Tools/Tasks.cs end-to-end

      - name: Assert no context has a pending model change
        working-directory: ${{ runner.temp }}/generated
        env:
          AUTH_CONTEXT: ${{ matrix.auth_context }}
        run: |
          set -euo pipefail
          contexts=(Persistence)
          if [ "$AUTH_CONTEXT" = "true" ]; then
            contexts+=(Auth)
          fi
          for context in "${contexts[@]}"; do
            project=$(find Src/Infrastructure -maxdepth 1 -type d -name "*.Infrastructure.$context")
            if [ -z "$project" ]; then
              echo "::error title=Missing project::No Infrastructure.$context project was generated."
              exit 1
            fi
            echo "::group::$context"
            dotnet ef migrations has-pending-model-changes --project "$project" --startup-project "$project" --configuration Release --no-build
            echo "::endgroup::"
          done

      # The gates the generated tree carries, as its hygiene task finds them.
      - name: Run the generated project's hygiene gates
        working-directory: ${{ runner.temp }}/generated
        run: dotnet run Tools/Tasks.cs hygiene

      # A generated feature builds in the layers that need no hand edit and passes its own tests there; the container and architecture tests wait for the edits new-feature prints. The aggregate one takes three more use cases from new-use-case, which refuses the record ones. The hygiene gates pass with three features present, and remove-feature --apply leaves the tree as it was.
      - name: Assert the feature generator round trip leaves the tree untouched
        if: matrix.generator == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          fail() { echo "::error title=Generator round trip::$1"; exit 1; }
          git init --quiet
          git add -A
          git -c user.name=acceptance -c user.email=acceptance@localhost commit --quiet -m generated
          cases=(
            "Orders Order --access owner --deletion delete"
            "Tags Tag --access shared"
            "Invoices Invoice --access owner --deletion anonymise --model aggregate --concurrency etag"
            "Receipts Receipt --access owner --deletion delete --model aggregate --concurrency etag --operations get,list,create"
          )
          mapfile -t layers < <(find Src/Domain Src/Application Tests/Domain Tests/Application -name '*.csproj' | sort)
          mapfile -t docker_free < <(grep -rl --include='*.csproj' '<IsTestProject>true</IsTestProject>' Tests | xargs -r grep -L 'Testcontainers' | sort)
          mapfile -t architecture < <(find Tests/Architecture -name '*.csproj')
          write() {
            local log="${{ runner.temp }}/new-feature-${1%% *}.log"
            # shellcheck disable=SC2086
            dotnet run Tools/Tasks.cs new-feature $1 > "$log" 2>&1 || { cat "$log"; fail "new-feature $1 failed."; }
            [ -n "$(git status --porcelain)" ] || fail "new-feature $1 wrote nothing."
            grep -q 'Feature page: docs/features/' "$log" || fail "new-feature $1 named no feature page."
            [ -d .feature-manifest ] || fail "new-feature $1 left no manifest."
          }
          extend() {
            local feature type
            read -r feature type _ <<< "$1"
            if [[ "$1" != *"--model aggregate"* ]]; then
              if dotnet run Tools/Tasks.cs new-use-case "$feature" "Archive${type}" --kind command > "${{ runner.temp }}/new-use-case.log" 2>&1; then
                fail "new-use-case accepted $feature, a feature of the simple shape."
              fi
              return
            fi
            for usecase in "Approve${type} --kind command" "Get${type}Totals --kind query" "CloseOverdue${feature} --kind command --input none"; do
              # shellcheck disable=SC2086
              dotnet run Tools/Tasks.cs new-use-case "$feature" $usecase > "${{ runner.temp }}/new-use-case.log" 2>&1 || { cat "${{ runner.temp }}/new-use-case.log"; fail "new-use-case $feature $usecase failed."; }
            done
          }
          compose() {
            local feature status
            for feature in "$@"; do
              status=0
              dotnet run "${{ github.workspace }}/.template.config/acceptance/ApplyFeatureEdits.cs" "${{ runner.temp }}/new-feature-$feature.log" . || status=$?
              case "$status" in
                0) ;;
                2) git checkout --quiet -- . && return 1 ;;
                *) fail "the edits new-feature printed for $feature could not be applied." ;;
              esac
            done
          }
          prove() {
            local projects feature home
            if compose "$@"; then
              dotnet build ./*.sln --configuration Release --no-restore -warnaserror || fail "the solution does not compile once the edits new-feature printed for $* are made."
              dotnet test "${architecture[0]}" --configuration Release --no-build --output Detailed || fail "the architecture tests fail once the edits new-feature printed for $* are made."
              projects=("${docker_free[@]}")
            else
              echo "::notice title=Generator round trip::$* holds a first owner feature, whose extra edits are prose, so only the domain and application layers are built."
              for home in "${layers[@]}"; do
                dotnet build "$home" --configuration Release --no-restore -warnaserror
              done
              mapfile -t projects < <(printf '%s\n' "${layers[@]}" | grep '^Tests/')
            fi
            for feature in "$@"; do
              mapfile -t homes < <(for home in "${projects[@]}"; do [ -n "$(find "$(dirname "$home")" -type d -path "*/Features/$feature" -not -path '*/bin/*' -not -path '*/obj/*')" ] && echo "$home"; done)
              [ "${#homes[@]}" -gt 0 ] || fail "new-feature $feature wrote no test in a Docker-free test project."
              for home in "${homes[@]}"; do
                dotnet test "$home" --configuration Release --no-build --output Detailed --filter-namespace "*.Features.$feature.*"
              done
            done
            git checkout --quiet -- .
          }
          remove() {
            for feature in "$@"; do
              dotnet run Tools/Tasks.cs remove-feature "$feature" --apply > "${{ runner.temp }}/remove-feature.log" 2>&1 || { cat "${{ runner.temp }}/remove-feature.log"; fail "remove-feature $feature --apply failed."; }
            done
            if [ -n "$(git status --porcelain)" ]; then
              git status --porcelain
              fail "remove-feature $* left the tree changed."
            fi
          }
          for one in "${cases[@]}"; do
            echo "::group::$one"
            write "$one"
            extend "$one"
            prove "${one%% *}"
            remove "${one%% *}"
            echo "::endgroup::"
          done
          echo "::group::all four together, removed last in first out"
          written=()
          for one in "${cases[@]}"; do
            write "$one"
            extend "$one"
            written=("${one%% *}" "${written[@]}")
          done
          prove "${written[@]}"
          dotnet run Tools/Tasks.cs hygiene
          remove "${written[@]}"
          echo "::endgroup::"

      # The generated project's packageManager and .node-version are this checkout's, word for word.
      - name: Set up pnpm (web legs)
        if: matrix.web == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: Src/Web/package.json
          cache: true
          cache_dependency_path: Src/Web/pnpm-lock.yaml

      - name: Set up Node.js (web legs)
        if: matrix.web == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: Src/Web/.node-version

      # A generated project holds one app, so it receives that shape's lockfile, not this checkout's union one.
      - name: Assert each generated web shape's lockfile is current
        if: matrix.web == 'true'
        run: dotnet run Tools/Tasks.cs web-lockfiles --check

      # The added app joins the stack by the two lines its README gives; the options stay unquoted, being several arguments.
      - name: Add a second app with cleanarch-webapp
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        env:
          SECOND_APP: ${{ matrix.second_app || '--framework placeholder' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          dotnet new cleanarch-webapp -n BackOffice --port 8082 $SECOND_APP
          leaked=$(grep -rIl -e PlaceholderSite -e placeholder-site -e PLACEHOLDER_SITE -e FrameworkSite -e framework-site -e FRAMEWORK_SITE Src/Web/apps/BackOffice || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Item template token leaked::$leaked"
            exit 1
          fi
          sed -i 's#^include:$#include:\n  - path: Src/Web/apps/BackOffice/compose.yml#' docker-compose.yml
          printf 'WEB_BACK_OFFICE_HOST_PORT=8082\n' >> .env.example
          grep -A3 '^include:' docker-compose.yml

      # Each entry is Name:port:framework; the app joins the stack by the two lines its README gives.
      - name: Add every other starter with cleanarch-webapp
        if: matrix.more_apps
        working-directory: ${{ runner.temp }}/generated
        env:
          MORE_APPS: ${{ matrix.more_apps }}
        run: |
          set -euo pipefail
          for app in $MORE_APPS; do
            IFS=: read -r name port framework <<< "$app"
            dotnet new cleanarch-webapp -n "$name" --framework "$framework" --port "$port" --scope sample-generated-project
            leaked=$(grep -rIl -e FrameworkSite -e framework-site -e FRAMEWORK_SITE "Src/Web/apps/$name" || true)
            if [ -n "$leaked" ]; then
              echo "::error title=Item template token leaked::$leaked"
              exit 1
            fi
            variable=$(sed -E 's/([a-z0-9])([A-Z])/\1_\2/g' <<< "$name" | tr '[:lower:]' '[:upper:]')
            sed -i "s#^include:\$#include:\n  - path: Src/Web/apps/$name/compose.yml#" docker-compose.yml
            printf 'WEB_%s_HOST_PORT=%s\n' "$variable" "$port" >> .env.example
          done
          grep -A8 '^include:' docker-compose.yml
          grep '^WEB_' .env.example

      # bootstrap's web step: each framework app is created by its official CLI, then pnpm install and pnpm api.
      - name: Create the framework apps, regenerate the client
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          dotnet run Tools/Tasks.cs web-scaffold
          if [ -n "$(find Src/Web/apps -name scaffold.json -o -name overlay -type d)" ]; then
            echo "::error title=App not created::An app still holds its scaffold.json or overlay/."
            exit 1
          fi

      - name: Install, lint, test and build the web workspace
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated/Src/Web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      # React Router's builder keeps its page in a client folder of dist; every other starter writes it at the root.
      - name: Assert every app with a build script builds its page
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          missing = [manifest.parent for manifest in sorted(pathlib.Path("Src/Web/apps").glob("*/package.json"))
                     if "build" in json.loads(manifest.read_text(encoding="utf-8")).get("scripts", {})
                     and not any((manifest.parent / "dist" / folder / "index.html").is_file() for folder in ("", "client"))]
          for app in missing:
              print(f"::error title=No built page::{app} has a build script and no index.html in dist or dist/client.")
          sys.exit(1 if missing else 0)
          PY

      # The workspace's globs pick the package up: no file but its own is edited, and the lockfile gains its importer.
      - name: Add a package with cleanarch-webpackage
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          dotnet new cleanarch-webpackage -n tokens --scope sample-generated-project
          leaked=$(grep -rIl -e app-template -e placeholder-package Src/Web/packages/tokens || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Item template token leaked::$leaked"
            exit 1
          fi
          cd Src/Web
          pnpm install --no-frozen-lockfile
          pnpm lint
          pnpm test
          pnpm build

      # A second run creates nothing and changes nothing: the client is reproducible and created apps are left alone.
      - name: Assert web-scaffold is idempotent
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          git init --quiet
          git add -A
          git -c user.name=acceptance -c user.email=acceptance@localhost commit --quiet -m generated
          dotnet run Tools/Tasks.cs web-scaffold
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Not idempotent::A second web-scaffold changed the tree."
            git status --porcelain
            git diff --stat
            exit 1
          fi

      # After the web steps, so a web leg's lockfile exists and git's ignore rules hide node_modules; the tool stays in this checkout.
      - name: Assert every path the generated pages cite exists
        run: dotnet run Tools/CheckDocPaths.cs "${{ runner.temp }}/generated"

      - name: Build the images and start the stack
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        env:
          STACK_ENV: ${{ matrix.stack_env }}
        run: |
          set -euo pipefail
          cp .env.example .env
          if [ -n "$STACK_ENV" ]; then
            printf '%b\n' "$STACK_ENV" >> .env
          fi
          docker compose build
          docker compose up --detach --wait --wait-timeout 300

      # Each web app answers on the port .env.example gives it, serves its page with the page headers, and relays to the API. An inline script runs only by its hash in the served script-src, which only React Router's image adds; an event-handler attribute never does.
      - name: Assert every web app serves its page and relays to the API
        if: matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          fail() { echo "::error title=Web app::$1"; exit 1; }
          mapfile -t ports < <(grep -oE '^WEB_[A-Z0-9_]+_HOST_PORT=[0-9]+' .env | cut -d= -f2)
          [ "${#ports[@]}" -gt 0 ] || fail "No WEB_*_HOST_PORT in .env.example."
          for port in "${ports[@]}"; do
            base="http://127.0.0.1:${port}"
            curl -fsS -D headers.txt -o page.html "$base/"
            headers=$(cat headers.txt)
            echo "$headers"
            python3 - "$base" headers.txt page.html <<'PY' || fail "$base/ runs an inline script its Content-Security-Policy does not allow by hash."
          import base64, hashlib, re, sys
          base, headers, page = sys.argv[1], open(sys.argv[2], encoding="utf-8").read(), open(sys.argv[3], encoding="utf-8").read()
          policy = next((line.split(":", 1)[1] for line in headers.splitlines() if line.lower().startswith("content-security-policy:")), "")
          allowed = next((directive.split()[1:] for directive in policy.split(";") if directive.split()[:1] == ["script-src"]), [])
          inline = [body for attributes, body in re.findall(r"<script\b([^>]*)>(.*?)</script\s*>", page, re.I | re.S) if not re.search(r"\ssrc\s*=", attributes, re.I) and body.strip()]
          refused = [body for body in inline if f"'sha256-{base64.b64encode(hashlib.sha256(body.encode()).digest()).decode()}'" not in allowed]
          handlers = len(re.findall(r"<[^>]*\son[a-z]+\s*=", page, re.I))
          styles = sum(1 for body in re.findall(r"<style\b[^>]*>(.*?)</style\s*>", page, re.I | re.S) if body.strip())
          attributes = len(re.findall(r"<[^>]*\sstyle\s*=", page, re.I))
          print(f"{base}/: {len(inline)} inline script(s), {len(refused)} without its hash in script-src, {handlers} event-handler attribute(s), {styles} style element(s), {attributes} style attribute(s).")
          sys.exit(1 if refused or handlers else 0)
          PY
            grep -qi '^content-security-policy:.*frame-ancestors' <<< "$headers" || fail "$base/ has no CSP with frame-ancestors."
            grep -qi '^x-content-type-options: nosniff' <<< "$headers" || fail "$base/ has no X-Content-Type-Options."
            grep -qi '^referrer-policy:' <<< "$headers" || fail "$base/ has no Referrer-Policy."
            grep -qi '^cache-control: no-cache' <<< "$headers" || fail "$base/ is cached."
            grep -qi '<html' page.html || fail "$base/ served no page."
            curl -fsS "$base/health" > /dev/null || fail "$base/health is not relayed to the API."
            status=$(curl -sS -o relay.json -D relay.headers -w '%{http_code}' "$base/api/v1/relay-check")
            case "$status" in
              404) code=route.notFound ;;
              401) code=auth.required ;;
              *) fail "$base/api/ answered $status instead of the API's 404, or its 401 under authentication." ;;
            esac
            grep -qi '^content-type: application/problem+json' relay.headers || fail "$base/api/ was not answered by the API."
            grep -q "\"code\":\"$code\"" relay.json || fail "$base/api/ answered $status without the API's $code problem code."
            echo "Web app on $port: page, headers, /health and /api/ relay verified."
          done

      - name: Stack logs on failure
        if: failure() && matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always() && matrix.web == 'true'
        working-directory: ${{ runner.temp }}/generated
        run: |
          if [ -f .env ]; then
            docker compose down --volumes
          fi

  # A refused combination must exit non-zero and write nothing.
  template-refusals:
    name: Template refuses unsupported options
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the template package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: template-package
          path: ${{ runner.temp }}/package

      - name: Install the template package
        run: dotnet new install "${{ runner.temp }}"/package/*.nupkg

      - name: Assert each unsupported combination exits non-zero and writes nothing
        run: |
          set -euo pipefail
          refuse() {
            local out="${{ runner.temp }}/refused-$1"
            shift
            if dotnet new cleanarch-webapi -n Sample.Refused -o "$out" "$@"; then
              echo "::error title=Accepted::'dotnet new cleanarch-webapi $*' must be refused."
              exit 1
            fi
            if [ -e "$out" ] && [ -n "$(find "$out" -type f -print -quit)" ]; then
              echo "::error title=Wrote files::'dotnet new cleanarch-webapi $*' was refused but left files behind."
              exit 1
            fi
          }
          refuse alone --auth none
          refuse notes --auth none --examples notes
          refuse admin-web --auth none --examples none --files false --web placeholder --web-audience admin
          # A database stays refused until its overlay under .template.config/variants/database-<name>/ is wired.
          refuse mysql --database mysql
