name: Template web lockfiles

# Template repository only: each generated web shape carries a lockfile of its own, which a change to the union Src/Web/pnpm-lock.yaml, Dependabot's included, leaves stale until web-lockfiles writes it again.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One run per ref: a new push to a pull request cancels the previous one.
concurrency:
  group: template-web-lockfiles-${{ github.ref }}
  cancel-in-progress: true

# Least privilege; this run writes nothing, and template-web-lockfiles-commit.yml pushes to a Dependabot branch what it uploads.
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  lockfiles:
    name: Web lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version and its hash come from packageManager in Src/Web/package.json, which writes every lockfile.
      - name: Set up pnpm (from package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: Src/Web/package.json
          cache: true
          cache_dependency_path: Src/Web/pnpm-lock.yaml

      - name: Set up Node.js (from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: Src/Web/.node-version

      - name: Set up .NET SDK (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Written rather than checked, so the lockfiles a stale shape needs exist to be uploaded.
      - name: Write each generated web shape's lockfile
        run: dotnet run Tools/Tasks.cs web-lockfiles

      - name: Collect the lockfiles the task changed
        id: changed
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --porcelain --untracked-files=all -- .template.config/variants | cut -c4-)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Every generated web shape's lockfile is current."
            exit 0
          fi
          for file in "${changed[@]}"; do
            if [ -f "$file" ]; then
              install -D -m 0644 "$file" "${{ runner.temp }}/web-lockfiles/$file"
            fi
          done
          echo "stale=true" >> "$GITHUB_OUTPUT"
          git status --short -- .template.config/variants

      # The variants sit under a dot folder, which the action leaves out unless told.
      - name: Upload the lockfiles the task wrote
        if: steps.changed.outputs.stale == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-lockfiles
          path: ${{ runner.temp }}/web-lockfiles/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail on a stale lockfile
        if: steps.changed.outputs.stale == 'true'
        run: |
          echo "::error title=Stale web lockfile::A generated web shape's lockfile differs from what the pinned pnpm writes for it. Run dotnet run Tools/Tasks.cs web-lockfiles and commit what it writes; on a Dependabot pull request, template-web-lockfiles-commit.yml commits it."
          exit 1
