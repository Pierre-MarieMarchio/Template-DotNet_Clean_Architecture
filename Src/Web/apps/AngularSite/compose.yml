services:
  web-angular-site:
    build:
      context: ../..
      dockerfile: apps/AngularSite/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_ANGULAR_SITE_HOST_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [backend]
