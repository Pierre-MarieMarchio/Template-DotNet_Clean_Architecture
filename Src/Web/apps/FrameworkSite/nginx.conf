#if (webBlazorWasm && externalAuth)
# A template: the image's entrypoint substitutes API_UPSTREAM, NGINX_LOCAL_RESOLVERS and SIGN_IN_AUTHORITY at start.
#else
# A template: the image's entrypoint substitutes API_UPSTREAM and NGINX_LOCAL_RESOLVERS at start.
#endif
map $uri $web_cache_control {
    #if (webBlazorWasm)
    "~^/_framework/" "public, max-age=31536000, immutable";
    #endif
    "~-(?=[A-Za-z0-9_-]*[A-Z0-9])[A-Za-z0-9_-]{8,}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
    default "no-cache";
}
#if (webBlazorWasm && externalAuth)

# The provider's origin: the page fetches its discovery document and tokens there, and renews them in a hidden frame that lands back on the page.
map "${SIGN_IN_AUTHORITY}" $sign_in_origin {
    "~^(?<origin>https?://[A-Za-z0-9.-]+(:[0-9]+)?)(/|$)" $origin;
    default "";
}
#endif

server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    #if (webBlazorWasm)
    gzip_static on;
    #endif

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        #if (webReactRouter || webBlazorWasm)
        # The image build adds to script-src the SHA-256 of each inline script in the built page.
        #endif
        #if (webBlazorWasm && externalAuth)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' $sign_in_origin; frame-src 'self' $sign_in_origin" always;
        #elseif (webBlazorWasm)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'" always;
        #endif
        #if (webAngular)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
        #endif
        #if (!webAngular && !webBlazorWasm)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
        #endif
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control $web_cache_control always;

        try_files $uri /index.html;

        location ~ "-(?=[A-Za-z0-9_-]*[A-Z0-9])[A-Za-z0-9_-]{8,}\.[a-z0-9]+$" {
            try_files $uri =404;
        }
        #if (webBlazorWasm)

        location /_framework/ {
            try_files $uri =404;
        }
        #endif
    }
}
